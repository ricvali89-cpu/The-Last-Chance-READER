t-fit:contain;box-shadow:0 6px 18px #0002}.section-break{display:flex;align-items:center;justify-content:center;gap:.55em;width:min(150px,45%);margin:.78em auto;color:#756b5d;opacity:.72}.section-break::before,.section-break::after{content:"";height:1px;flex:1;background:#9b8d78}.section-break span{font-size:.72em;line-height:1}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP08/CAP08_PRIMO_PASSO_OPENING_DEFINITIVA.png?v=85cb3971" alt="Capitolo VIII — Primo Passo" draggable="false"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"paragraphs":[{"i":0,"text":"La pietra rimase solida sotto i miei piedi. Continuai a camminare a occhi chiusi per alcuni passi. L’aria era più fresca, quasi immobile; il rumore degli stivali si perdeva senza un’eco che mi aiutasse a valutare la distanza delle pareti.","italic":false},{"i":1,"text":"Quando aprii gli occhi, fu un riflesso freddo a catturare la mia attenzione. Più in basso, una superficie nera raccoglieva la luce diffusa del luogo. Ne seguii il contorno fino a riconoscere l’acqua, così ferma da sembrare pietra levigata.","italic":false},{"i":2,"text":"Sollevai lo sguardo. Quella distesa occupava una cavità enorme, la cui volta si perdeva nell’oscurità. Mi trovavo su una terrazza naturale di roccia nera, sopra una riva irregolare che disegnava un’ampia insenatura. Oltre, l’acqua proseguiva fin dove riuscivo a vedere.","italic":false},{"i":3,"text":"Cercai un punto di riferimento lungo la costa per orientarmi. Fu allora che notai le prime figure. Una emergeva lentamente dal mare, mentre altre avanzavano sulla riva senza una direzione evidente. Poco più in là, qualcuno restava immobile, nonostante gli altri gli passassero accanto.","italic":false},{"i":4,"text":"Tra quelle persone si muovevano individui coperti da lunghe vesti scure. Uno di loro raggiunse chi era rimasto immobile e gli indicò il gruppo che avanzava. Bastò quel gesto perché si rimettesse in cammino. Più lontano, un altro incappucciato riportò verso gli altri qualcuno che si era avvicinato di nuovo all’acqua. Da quella distanza non riuscivo a distinguerne i volti.","italic":false},{"i":5,"text":"Seguii il movimento lungo la riva. Questa si prolungava fino a una formazione di roccia che separava l’insenatura da un secondo bacino. Il passaggio si restringeva presso una piattaforma rialzata, dove sostava una figura molto più alta delle altre. Oltre quel punto intravedevo moli di pietra e alcune grandi imbarcazioni dalle forme antiche, ferme sull’acqua nera.","italic":false},{"i":6,"text":"Mi voltai per individuare il punto da cui ero arrivato. Dove mi aspettavo l’apertura, la parete proseguiva senza interruzioni. Percorsi la breve distanza che mi separava da essa e controllai la superficie: nessun varco, nessuna traccia dell’oscurità che avevo attraversato. Non avrei potuto tornare indietro da lì.","italic":false},{"i":7,"text":"Raggiunsi di nuovo il margine della terrazza. Le persone che riuscivo a seguire finivano per passare dalla piattaforma prima di dirigersi verso i moli, mentre gli incappucciati si occupavano di chi si allontanava dal gruppo. Capivo dove si concentrava il movimento, ma non ancora come evitarlo. Per il momento, però, nessuno sembrava essersi accorto di me.","italic":false},{"i":8,"text":"Non avevo motivo di presentarmi spontaneamente a chi controllava quel passaggio. Prima volevo capire se esistesse una via per proseguire senza unirmi agli altri. Mi spostai lungo il bordo della terrazza, tenendomi vicino alla roccia e cercando punti dai quali osservare meglio il bacino.","italic":false},{"i":9,"text":"Una delle imbarcazioni lasciò lentamente il molo. Non scorsi nessuno al timone; la seguii finché non sparì in una delle grandi aperture oltre il bacino. Anche ammesso che quelle navi conducessero più in profondità, per raggiungerle avrei dovuto inserirmi nel percorso degli altri. Preferivo evitarlo.","italic":false},{"i":10,"text":"Mi concentrai allora sulla parete oltre la piattaforma. Sopra una parte degli approdi correva un camminamento asciutto, scavato nella roccia. Seguiva il bordo della cavità e poi si abbassava fino a sparire dietro una curva. Non potevo vedere dove terminasse, ma era la prima strada che individuavo separata dalle rotte delle navi.","italic":false},{"i":11,"text":"La via più diretta per raggiungerlo passava ancora per quello snodo. Cercai un'alternativa lungo la terrazza: la roccia scendeva in gradoni irregolari, alcuni interrotti da salti troppo ripidi. Scelsi di controllare quelli più vicini alla parete, prima di rinunciare all'idea di aggirare il passaggio centrale.","italic":false},{"i":12,"text":"I gradoni conducevano a un ripiano stretto, oltre il quale la roccia precipitava verso la riva. Per continuare avrei dovuto entrare nel gruppo guidato dagli incappucciati. Risalii e provai a costeggiare il promontorio, ma anche quel percorso sbucava davanti alla piattaforma. Non trovai un accesso al camminamento che evitasse quel punto.","italic":false},{"i":13,"text":"Stavo decidendo come muovermi quando uno degli incappucciati smise di accompagnare le persone verso lo snodo. Si fermò e si girò dalla mia parte. Rimasi dov'ero, aspettando che riprendesse il proprio compito.","italic":false},{"i":14,"text":"Un secondo si arrestò poco più avanti. Sotto quei cappucci non riuscivo a distinguere alcun volto, ma entrambi erano ormai rivolti verso di me. Il primo lasciò il gruppo e si incamminò nella mia direzione. L'altro lo seguì.","italic":false},{"i":15,"text":"Aspettai che fossero vicini. Il primo si arrestò a pochi passi: sotto il cappuccio non distinguevo occhi, pelle o lineamenti, soltanto oscurità. Dalle maniche spuntavano mani sottili, secche, quasi scheletriche.","italic":false},{"i":16,"text":"Sollevò una mano e indicò la piattaforma. Restai fermo un istante, per capire se il gesto fosse rivolto a me. Lo ripeté senza parlare. Intanto il secondo si portò al mio fianco, senza toccarmi.","italic":false},{"i":17,"text":"Nessuno dei due aveva tentato di usare la forza. Estrarre la Spada avrebbe provocato uno scontro inutile. Inoltre, la strada che cercavo passava comunque di lì. Li seguii.","italic":false},{"i":18,"text":"Scendemmo dalla terrazza e raggiungemmo il passaggio dove confluivano le persone emerse dal mare. Uno mi precedeva, l'altro avanzava a poca distanza. Sulla piattaforma, la figura che avevo intravisto da lontano acquistò contorni più netti: molto alta, con la pelle grigia e una lunga asta scura in mano. Non l'avevo mai incontrata, ma dalle descrizioni che conoscevo e dal posto che occupava capii chi avevo davanti.","italic":false},{"i":19,"text":"Caron.","italic":false},{"i":20,"text":"I Velati si arrestarono ai piedi della piattaforma. Caron non mi rivolse subito la parola. Davanti a lui, un uomo con gli occhi vuoti attese che gli accostasse allo sterno un piccolo disco scuro. Un marchio comparve sulla pelle e uno degli incappucciati lo accompagnò verso i moli. Solo allora Caron si voltò verso di me.","italic":false},{"i":21,"text":"I suoi occhi chiarissimi si soffermarono sulla Spada. «Sei vivo. E di natura divina.»","italic":false},{"i":22,"text":"«Mi chiamo Gabriel. Devo raggiungere i Cerchi.»","italic":false},{"i":23,"text":"«Chi ti ha mandato?»","italic":false},{"i":24,"text":"«Ho un incarico. È quanto posso dirti.»","italic":false},{"i":25,"text":"Caron non insistette. Un'altra persona arrivò davanti alla piattaforma e lui tornò a occuparsene, come se il nostro colloquio fosse già terminato.","italic":false},{"i":26,"text":"«Non intendo prendere una delle tue navi» dissi. «Ho visto un camminamento oltre la piattaforma.»","italic":false},{"i":27,"text":"«Le navi trasportano chi ha già una destinazione. Tu non ne hai.»","italic":false},{"i":28,"text":"«Non sono venuto a farmene assegnare una.»","italic":false},{"i":29,"text":"Caron lasciò che l'anima successiva proseguisse verso i moli. «Allora non hai bisogno che decida nulla per te.»","italic":false},{"i":30,"text":"Quella risposta non mi dava alcuna indicazione. E lui non sembrava intenzionato ad aggiungere altro.","italic":false},{"i":31,"text":"«Non ti sto chiedendo di decidere per me, Caron. Voglio sapere come scendere.»","italic":false},{"i":32,"text":"Caron sollevò l'asta e indicò il camminamento scavato nella parete, oltre gli approdi.","italic":false},{"i":33,"text":"«La strada è quella. Scende verso i Cerchi.»","italic":false},{"i":34,"text":"«E allora perché i Velati mi hanno condotto qui?»","italic":false},{"i":35,"text":"«Perché non sapevano dove mandarti.»","italic":false},{"i":36,"text":"«Avrebbero potuto lasciarmi passare.»","italic":false},{"i":37,"text":"«Non sei un morto, Gabriel. Sei arrivato dove arrivano soltanto i morti. Cosa ti aspettavi?»","italic":false},{"i":38,"text":"La risposta mi infastidì, ma aveva ragione su un punto: ero entrato in un luogo di cui conoscevo ben poco. E continuavo a dipendere dalle indicazioni di qualcuno che non aveva alcun interesse nella mia missione.","italic":false},{"i":39,"text":"Un altro gruppo raggiunse la piattaforma. Caron si occupò di una delle anime, imprimendole sul petto un segno diverso da quello che avevo visto poco prima.","italic":false},{"i":40,"text":"«Non hanno idea di cosa stia succedendo, vero?» dissi.","italic":false},{"i":41,"text":"«Non ricordano nemmeno chi sono. Io riconosco la loro destinazione e il sigillo permette ai Velati di condurli dove devono andare.» Caron lasciò passare l'anima. «Ma tu non hai un sigillo. E non sei affar mio.»","italic":false},{"i":42,"text":"«Non ti sto chiedendo di prenderti cura di me.»","italic":false},{"i":43,"text":"«Bene. Allora sai cosa fare.»","italic":false},{"i":44,"text":"Rivolsi l'attenzione al camminamento. Dalla piattaforma potevo raggiungerlo senza difficoltà, e la sua pendenza sembrava confermare che conducesse più in profondità.","italic":false},{"i":45,"text":"«Non tenterai di fermarmi?»","italic":false},{"i":46,"text":"«Non ne ho motivo. Ma non confondere questo con la certezza di arrivare dove vuoi.»","italic":false},{"i":47,"text":"Mi voltai verso di lui. «Cosa intendi?»","italic":false},{"i":48,"text":"«Che non tutto ciò che puoi percorrere ti porterà dove desideri.»","italic":false},{"i":49,"text":"Valutai quelle parole. Poteva trattarsi di un avvertimento sui pericoli della discesa o sulle strade che avrei incontrato. Non avevo elementi per stabilirlo.","italic":false},{"i":50,"text":"«Lo scoprirò strada facendo.»","italic":false},{"i":51,"text":"Caron non aggiunse altro. Tornò a occuparsi delle anime in attesa, mentre io mi dirigevo verso il camminamento.","italic":false},{"i":52,"text":"Imboccai la discesa. I moli rimasero in vista ancora per un tratto, poi la curva della parete me li nascose. Continuai senza incontrare ostacoli.","italic":false},{"i":53,"text":"Più avanti, tra le rocce, riapparve il riflesso dell'acqua. Pensai che la via descrivesse un ampio giro attorno alla cavità. Poi riconobbi il profilo dell'insenatura e, più in alto, la terrazza dalla quale avevo osservato le anime.","italic":false},{"i":54,"text":"Accelerai, ma il percorso sbucò ai margini della riva degli arrivi. Mi fermai. Non avevo invertito la direzione; doveva essermi sfuggita una deviazione. Decisi di tornare a controllare.","italic":false},{"i":55,"text":"Ripercorsi la discesa più lentamente, controllando ogni punto in cui la parete rientrava. Prima della curva scelsi come riferimento una lunga fenditura obliqua, poi seguii il margine del sentiero senza perderlo di vista. Non incontrai bivi. Quando riapparve l'insenatura, non potei più attribuire il ritorno a una distrazione.","italic":false},{"i":56,"text":"Raggiunsi ancora la curva e mi fermai a esaminarla. Nulla sembrava fuori posto: il passaggio continuava normalmente, senza aperture nascoste o interruzioni. Questa volta lo superai tenendomi sul lato opposto. Il risultato fu identico.","italic":false},{"i":57,"text":"Mi concessi qualche istante per ragionare. Avevo escluso le deviazioni, gli errori di orientamento e persino la possibilità di aver seguito inconsapevolmente un percorso diverso. Eppure non riuscivo ad andare oltre. La strada non era bloccata: ero io che, per qualche ragione, non potevo proseguire. Provai ancora, cambiando andatura e controllando gli stessi riferimenti, ma finii nuovamente sulla riva.","italic":false},{"i":58,"text":"Ripensai all'avvertimento di Caron. Avrei dovuto chiedergli cosa intendesse, anziché presumere di poter risolvere tutto avanzando. L'idea di tornare da lui non mi piaceva, ma continuare a ripetere gli stessi controlli non mi avrebbe dato altre risposte.","italic":false},{"i":59,"text":"Tornai verso lo snodo. I Velati accompagnavano nuove anime alla piattaforma, mentre Caron continuava a occuparsi degli arrivi. Nessuno sembrò prestare attenzione al mio ritorno.","italic":false},{"i":60,"text":"Mi avvicinai per parlargli, ma un movimento poco distante da lui mi fece rallentare. Ai piedi della piattaforma, fuori dal percorso dei morti, c'era qualcosa che non avevo visto prima.","italic":false},{"i":61,"text":"Un cane.","italic":false}],"arts":[{"after":61,"src":"/The-Last-Chance-READER/chapters/CAP08/CAP08_ILL_01_DEFINITIVA.png?v=f7b3efa4","alt":"Gabriel scorge un cane ai margini della piattaforma di Caron","cls":"wide"}],"breaks":[]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([61]);
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;im.draggable=false;f.appendChild(im);return f}if(item.type==="break"){const d=document.createElement("div");d.className="section-break";d.setAttribute("aria-hidden","true");d.innerHTML="<span>✦</span>";return d}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});DATA.arts.filter(x=>x.after===p.i).forEach(a=>out.push({type:"art",...a}));if(DATA.breaks.includes(p.i))out.push({type:"break"})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   if(item.type==="break"){
     const br=nodeFor(item);
     page.d.appendChild(br);
     if(!fits(page.d)){br.remove();newPage();page.d.appendChild(nodeFor(item))}
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VIII</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP07/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a><a href="../CAP09/index.html">Capitolo successivo →</a></nav></div>';track.appendChild(end);update()
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap08-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP08 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VIII</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP07/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a><a href="../CAP09/index.html">Capitolo successivo →</a></nav></div>';track.appendChild(end);update()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
