*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#f5f1e8;color:#191816}.book-track{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pinch-zoom}.book-track::-webkit-scrollbar{display:none}.book-page{flex:0 0 100vw;width:100vw;height:100vh;height:100dvh;scroll-snap-align:start;overflow:hidden;background:#f5f1e8}.opening{display:flex;align-items:center;justify-content:center;background:#000;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.opening img{display:block;max-width:96%;max-height:96%;object-fit:contain}.reading-page{padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.page-inner{position:relative;z-index:1;width:min(100%,720px);height:100%;margin:0 auto;overflow:hidden;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.46;text-align:left;hyphens:none;-webkit-hyphens:none}.reading-page{position:relative;isolation:isolate}.reading-page::before{content:"";position:absolute;z-index:0;inset:-5% -12%;background:url("/The-Last-Chance-READER/assets/REGNO_CELESTE_SIGILLO_V1_DEFINITIVO.png?v=610853e0") center/cover no-repeat;opacity:.06;filter:grayscale(1) sepia(.18);pointer-events:none}@media(max-width:600px){.reading-page::before{inset:-4% -28%;background-size:cover;opacity:.06}}.page-inner p{display:inline;margin:0;text-indent:0;font-weight:400}.page-inner p::after{content:" "}.page-inner p.editorial-break{display:block;margin-top:.72em}.page-inner p.editorial-break::after{content:""}.page-inner em{font-style:italic}.story-art{height:50dvh;margin:8px auto 10px;text-align:center;display:flex;align-items:center;justify-content:center}.story-art img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;margin:auto;object-fit:contain;box-shadow:0 6px 18px #0002}.section-break{display:flex;align-items:center;justify-content:center;gap:.55em;width:min(150px,45%);margin:.78em auto;color:#756b5d;opacity:.72}.section-break::before,.section-break::after{content:"";height:1px;flex:1;background:#9b8d78}.section-break span{font-size:.72em;line-height:1}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP09/CAP09_ESTRANEI_OPENING_DEFINITIVA.jpeg?v=dd82385a" alt="Capitolo IX — Estranei" draggable="false"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"paragraphs":[{"i":0,"text":"Era grande, con il pelo scuro segnato da ciuffi grigi. Se ne stava ai piedi della piattaforma, fuori dal percorso delle anime. Un gruppo gli passò vicino, ma il cane non si unì al movimento.","italic":false},{"i":1,"text":"Alzò il muso nella mia direzione. Aveva gli occhi color ambra, che seguirono i miei passi verso la piattaforma. Non fece alcun tentativo di avvicinarsi.","italic":false},{"i":2,"text":"Mi chiesi che cosa ci facesse lì. I Velati non gli prestavano attenzione e lui non sembrava attendere alcun ordine. Avrei chiesto spiegazioni anche su quell'animale, ma prima volevo capire cosa mi impedisse di proseguire.","italic":false},{"i":3,"text":"Quando Caron terminò di occuparsi dell'anima davanti a lui, mi feci avanti.","italic":false},{"i":4,"text":"«Ho percorso il camminamento che mi hai indicato», dissi. «Non ci sono bivi. Eppure mi riporta sempre alla riva.»","italic":false},{"i":5,"text":"«Non hai sbagliato strada», rispose Caron.","italic":false},{"i":6,"text":"«Allora perché continuo a ritrovarmi qui?»","italic":false},{"i":7,"text":"«Ti avevo avvertito.»","italic":false},{"i":8,"text":"«Mi avevi detto che forse non sarei arrivato dove volevo. Non che sarei tornato al punto di partenza.»","italic":false},{"i":9,"text":"Un Velato accompagnò un'altra anima alla piattaforma. Caron le impresse un sigillo sul petto e la lasciò proseguire.","italic":false},{"i":10,"text":"«E se mi dessi uno di quei sigilli?» chiesi. «Potrei passare?»","italic":false},{"i":11,"text":"«Vorresti essere assegnato a un Cerchio?»","italic":false},{"i":12,"text":"«Voglio attraversarli, non essere condannato.»","italic":false},{"i":13,"text":"«Allora non è un sigillo quello che ti serve.»","italic":false},{"i":14,"text":"«Mi serve un'autorizzazione», dissi.","italic":false},{"i":15,"text":"Caron annuì appena.","italic":false},{"i":16,"text":"«E potresti darmela tu?»","italic":false},{"i":17,"text":"«Io mi occupo di chi arriva qui per essere smistato, Gabriel. Tu non sei uno di loro.»","italic":false},{"i":18,"text":"Il cane si spostò per lasciare passare un Velato, poi tornò a fermarsi poco distante dalla piattaforma.","italic":false},{"i":19,"text":"«E lui?» chiesi, indicando l'animale. «Perché non viene smistato come gli altri?»","italic":false},{"i":20,"text":"Caron seguì il mio sguardo. «Perché non è un dannato. E non ha nessuna destinazione da farsi assegnare.»","italic":false},{"i":21,"text":"«Allora cosa ci fa qui con te?»","italic":false},{"i":22,"text":"«Ha trovato un posto dove fermarsi. Non gliel'ho imposto io, e non è obbligato a restare.»","italic":false},{"i":23,"text":"«Quindi potrebbe anche andarsene?»","italic":false},{"i":24,"text":"«Lo fa già. A volte sparisce per un po', poi torna e si sistema qui vicino, come se non fosse mai partito.»","italic":false},{"i":25,"text":"Mi voltai verso il camminamento.","italic":false},{"i":26,"text":"«Vuoi dire che può scendere anche nei Cerchi?»","italic":false},{"i":27,"text":"«Certo. Conosce quelle vie piuttosto bene, anche se non saprei dirti quanto lontano si spinga ogni volta.»","italic":false},{"i":28,"text":"«E come riesce a passarci? Io non sono arrivato nemmeno oltre la prima curva.»","italic":false},{"i":29,"text":"«Gli ho dato un collare di transito», spiegò Caron. «Gli permette di percorrere quelle strade senza avere una destinazione assegnata.»","italic":false},{"i":30,"text":"Solo allora osservai meglio il collo del cane. Tra il pelo scuro riuscii a distinguere il bordo di un collare che fino a quel momento mi era sfuggito.","italic":false},{"i":31,"text":"«Dove l'hai trovato?» chiesi.","italic":false},{"i":32,"text":"«Non qui, tra gli arrivi. Era solo, e l'ho portato con me.»","italic":false},{"i":33,"text":"«Il tuo posto sarebbe questa piattaforma?»","italic":false},{"i":34,"text":"«Non è molto, lo so. Ma è quel che avevo da offrirgli.»","italic":false},{"i":35,"text":"«E il collare gliel'hai dato per questo?»","italic":false},{"i":36,"text":"«Non volevo che restare qui significasse non potersene andare.»","italic":false},{"i":37,"text":"«Se hai potuto aiutare lui, perché non puoi aiutare me?»","italic":false},{"i":38,"text":"Caron tornò a rivolgersi alle anime in attesa. Ne lasciò avvicinare una prima di rispondermi.","italic":false},{"i":39,"text":"«Non ti ho impedito di scendere. Ma di te so soltanto che hai un incarico che non vuoi spiegarmi. Non intendo assumermene la responsabilità.»","italic":false},{"i":40,"text":"«Mi basta poter superare quella curva.»","italic":false},{"i":41,"text":"«E come pensi di riuscirci?»","italic":false},{"i":42,"text":"«Potrei prendere in prestito il collare.»","italic":false},{"i":43,"text":"«Non è più mio, Gabriel. E non vedo perché il cane dovrebbe lasciarselo sfilare.»","italic":false},{"i":44,"text":"«E se invece riuscissi a convincerlo a venire con me?»","italic":false},{"i":45,"text":"«Puoi provarci. Ma non aspettarti che ti segua soltanto perché glielo chiedi.»","italic":false},{"i":46,"text":"Mi avvicinai senza allungare le mani. Il cane si alzò e arretrò appena, quanto bastava per restare fuori dalla mia portata. Mi fermai per non farlo allontanare di più.","italic":false},{"i":47,"text":"«Ehi», dissi a voce bassa. «Ti va di venire con me?» Indicai il camminamento.","italic":false},{"i":48,"text":"Il cane continuò a osservarmi. Poi, senza avvicinarsi, si voltò e si avviò verso il sentiero. Lo seguii; quando cercai di ridurre la distanza, accelerò fino a correre.","italic":false},{"i":49,"text":"«Aspetta!» lo chiamai. Non rallentò. Lo vidi raggiungere la curva e scomparire oltre la parete.","italic":false},{"i":50,"text":"Presi la stessa direzione e proseguii lungo la discesa. Dopo un tratto rividi il riflesso del Mare Nero. Il sentiero mi riportò alla riva degli arrivi, ma del cane non c'era traccia. Lui era riuscito a proseguire; io no.","italic":false},{"i":51,"text":"Un rumore di zampe sulla pietra mi fece voltare. Il cane era tornato dal camminamento e si fermò a pochi passi da me. Rimase lì a osservarmi.","italic":false},{"i":52,"text":"«Sei tornato», dissi piano.","italic":false},{"i":53,"text":"Mi accovacciai senza chiamarlo di nuovo e tenni una mano aperta davanti a me. Per qualche istante non si mosse. Poi si avvicinò abbastanza da sfiorarmi le dita con il muso. Cominciai ad accarezzargli il dorso, lentamente. Non si allontanò.","italic":false},{"i":54,"text":"Quando spostai la mano verso il collo, rividi il collare tra il pelo. Mi fermai prima di toccarlo. Avevo provato a seguire il cane, ma non ero riuscito nemmeno a raggiungerlo. Forse non era necessario togliergli il collare. Potevo tentare di tenerlo mentre lui continuava a indossarlo.","italic":false},{"i":55,"text":"Feci scivolare due dita verso il collare. Il cane sollevò il muso. Aspettai che lo abbassasse di nuovo, poi passai le dita sotto il bordo, senza stringere. Non si ritrasse.","italic":false},{"i":56,"text":"Mi rialzai lentamente, cercando di non tirare. Fu il cane ad avviarsi verso il camminamento. Gli rimasi accanto, chinato quel tanto che bastava per non perdere il contatto.","italic":false},{"i":57,"text":"Riconobbi la fenditura obliqua sulla parete. Poco oltre c'era la curva. La superammo senza fermarci.","italic":false},{"i":58,"text":"Mi aspettavo di rivedere il riflesso del Mare Nero tra le rocce. Ma la riva non ricomparve. Il sentiero continuava a scendere.","italic":false}],"arts":[{"after":53,"src":"/The-Last-Chance-READER/chapters/CAP09/CAP09_ILL_01_DEFINITIVA.jpeg?v=64871442","alt":"Gabriel accovacciato accarezza il dorso di Argo sul camminamento dell'Anti-Inferno","cls":"wide"}],"breaks":[]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set();
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;im.draggable=false;f.appendChild(im);return f}if(item.type==="break"){const d=document.createElement("div");d.className="section-break";d.setAttribute("aria-hidden","true");d.innerHTML="<span>✦</span>";return d}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});DATA.arts.filter(x=>x.after===p.i).forEach(a=>out.push({type:"art",...a}));if(DATA.breaks.includes(p.i))out.push({type:"break"})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   if(item.type==="break"){
     const br=nodeFor(item);
     page.d.appendChild(br);
     if(!fits(page.d)){br.remove();newPage();page.d.appendChild(nodeFor(item))}
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo IX</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP08/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap09-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP09 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo IX</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP08/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
</script><script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/The-Last-Chance-READER/sw.js",{scope:"/The-Last-Chance-READER/",updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));}
</script></body></html>
