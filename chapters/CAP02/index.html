</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/CAP02_OPENING_DEFINITIVO_ALTO.jpeg?v=ed0c166c" alt="Capitolo II — Il Grande Concilio"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button></div><button id="bookmark" class="bookmark">🔖</button><script>
const DATA={"paragraphs":[{"i":0,"text":"Le porte si aprirono davanti a me senza produrre alcun suono.","italic":false},{"i":1,"text":"Avevo attraversato quella soglia altre volte, eppure entrare lì riusciva sempre a farmi lo stesso effetto. Lo spazio sembrava non avere fine. File concentriche di seggi si innalzavano su più livelli, occupate da esseri provenienti da ogni dominio della Creazione. Divinità che governavano mondi, popoli e forze antiche quanto la Creazione sedevano fianco a fianco, distribuite secondo il proprio pantheon e la propria funzione.","italic":false},{"i":2,"text":"Non era frequente vederli riuniti tutti insieme. Una convocazione simile avveniva soltanto quando una decisione superava i confini di un singolo regno.","italic":false},{"i":3,"text":"E quella volta la decisione riguardava la Terra.","italic":false},{"i":4,"text":"Entrai da solo. Il rumore dei miei passi si disperse nell'immensità del luogo mentre avanzavo verso il settore riservato ai Guardiani Celesti.","italic":false},{"i":5,"text":"Riconobbi Zeus quasi immediatamente. Era seduto poco distante dal centro, il corpo appena inclinato in avanti e una mano appoggiata al bracciolo. Lo avevo visto assumere quella posizione più di una volta e sapevo cosa significasse: era impaziente.","italic":false},{"i":6,"text":"Poco oltre sedeva Amaterasu, composta, attenta a ciò che la circondava senza lasciar trasparire ciò che pensava. Shiva occupava uno dei seggi dello stesso anello e sembrava quasi estraneo all'attesa che gravava sui presenti, raccolto in una quiete che non aveva nulla di distratto.","italic":false},{"i":7,"text":"Odino, invece, era impossibile da confondere. La sua figura massiccia occupava il seggio come se persino quello fosse stato costruito troppo piccolo per lui. I due corvi restavano quieti al suo fianco. L'unico occhio visibile scrutava i presenti con una durezza che conoscevo bene.","italic":false},{"i":8,"text":"Fu Anubi, però, ad attirare la mia attenzione.","italic":false},{"i":9,"text":"Mi trovavo ormai vicino al mio posto quando incrociai il suo sguardo. Non era rivolto a me, ma a qualcosa oltre la mia spalla, e indugiò in quella direzione appena più del necessario.","italic":false},{"i":10,"text":"Mi voltai.","italic":false},{"i":11,"text":"Il settore di Asgard era quasi completamente occupato.","italic":false},{"i":12,"text":"Quasi.","italic":false},{"i":13,"text":"Il posto di Loki era vuoto.","italic":false},{"i":14,"text":"La cosa mi sorprese appena. Un evento di quella portata non era qualcosa che si ignorava con leggerezza, ma Loki aveva sempre avuto un rapporto piuttosto personale con formalità e puntualità. Quando tornai a cercare Anubi, aveva già rivolto altrove la propria attenzione.","italic":false},{"i":15,"text":"Raggiunsi il mio posto. Da lì potevo vedere quasi tutti i presenti.","italic":false},{"i":16,"text":"E, sopra di loro, il Padre.","italic":false},{"i":17,"text":"Stava lì, seduto sul suo scranno, con la naturale autorità di chi non aveva bisogno di imporsi per essere riconosciuto. La luce alle spalle era così intensa da rendere difficile distinguerne completamente il volto; la figura emergeva appena da quel chiarore, separata dagli altri non soltanto dall'altezza.","italic":false},{"i":18,"text":"Nessuno gli era pari.","italic":false},{"i":19,"text":"Attesi, come tutti. Il brusio resistette ancora per qualche istante, finché la voce di Zeus non lo attraversò.","italic":false},{"i":20,"text":"«Quanto ancora dobbiamo aspettare?»","italic":false},{"i":21,"text":"Alcuni si voltarono verso di lui. Non ebbe il tempo di aggiungere altro.","italic":false},{"i":22,"text":"Una campana suonò.","italic":false},{"i":23,"text":"Un solo rintocco, profondo abbastanza da spegnere ogni voce. Il suono si propagò tutt'intorno e si dissolse lentamente.","italic":false},{"i":24,"text":"Il Grande Concilio aveva inizio.","italic":false},{"i":25,"text":"Zeus non perse tempo. Sollevò una mano e, al centro, apparve la Terra.","italic":false},{"i":26,"text":"Enorme.","italic":false},{"i":27,"text":"Sospesa sopra il pavimento, ruotava lentamente davanti a centinaia di occhi. Dapprima rimase intatta, azzurra e luminosa. Poi la sua superficie cambiò.","italic":false},{"i":28,"text":"Una città avvolta dal fumo. Un'esplosione. Edifici sventrati, uomini che correvano tra le macerie. Un'altra guerra. E un'altra ancora. Foreste abbattute, acque coperte di rifiuti, terre aride dove un tempo cresceva qualcosa.","italic":false},{"i":29,"text":"Zeus lasciò che fossero quelle immagini a parlare per prime.","italic":false},{"i":30,"text":"Osservai le reazioni intorno a me. Qualcuno distolse lo sguardo, altri scossero appena il capo. Una divinità poco distante si lasciò andare contro lo schienale, come se avesse già assistito a quelle scene troppe volte.","italic":false},{"i":31,"text":"Non c'era sorpresa sui loro volti.","italic":false},{"i":32,"text":"Era peggio.","italic":false},{"i":33,"text":"C'era rassegnazione.","italic":false},{"i":34,"text":"«Sappiamo tutti perché siamo qui» disse Zeus. «Li abbiamo osservati. Li abbiamo guidati. Li abbiamo lasciati scegliere.»","italic":false},{"i":35,"text":"Indicò la Terra.","italic":false},{"i":36,"text":"«E questa è la loro scelta. Guerra dopo guerra. Secolo dopo secolo. Cambiano i nomi, cambiano i confini, cambiano le armi. Loro no.»","italic":false},{"i":37,"text":"Un lieve movimento percorse i presenti.","italic":false},{"i":38,"text":"«Quanto ancora dovremmo osservare prima di ammettere ciò che abbiamo davanti agli occhi?»","italic":false},{"i":39,"text":"«Un giudizio non diventa più giusto soltanto perché viene pronunciato in fretta» disse Amaterasu.","italic":false},{"i":40,"text":"Zeus si voltò verso di lei.","italic":false},{"i":41,"text":"«In fretta?» le rispose.","italic":false},{"i":42,"text":"«Non ho detto che siano innocenti. Hanno ucciso per paura, per avidità, per terre alle quali hanno dato un nome e poi hanno deciso appartenessero soltanto a loro. Hanno inventato divisioni e poi sono morti per difenderle. Hanno devastato il mondo che li mantiene in vita.»","italic":false},{"i":43,"text":"Una nuova esplosione illuminò per un istante la proiezione.","italic":false},{"i":44,"text":"«Ma questo non è tutto ciò che sono» continuò Amaterasu. «Ho visto uomini sacrificarsi per persone che non conoscevano. Ho visto qualcuno tendere la mano a chi, il giorno prima, chiamava nemico. Li ho visti perdonare quando avrebbero avuto ogni ragione per odiare, creare bellezza mentre intorno a loro non restava altro che distruzione, amare sapendo che avrebbero perso ciò che amavano.»","italic":false},{"i":45,"text":"Nessuno la interruppe.","italic":false},{"i":46,"text":"«Non sto chiedendo di dimenticare ciò che hanno fatto. Sto chiedendo di ricordare anche ciò che sono capaci di fare. Perciò, se oggi dobbiamo condannarli, voglio almeno essere certa che non stiamo distruggendo anche ciò che avrebbero potuto diventare.»","italic":false},{"i":47,"text":"«E nel frattempo?» intervenne Odino.","italic":false},{"i":48,"text":"Il dio norreno si sporse in avanti, ma non aveva bisogno di alzare il tono per attirare l'attenzione.","italic":false},{"i":49,"text":"«Mentre aspettiamo di scoprire ciò che potrebbero diventare, chi paga il prezzo di ciò che sono?»","italic":false},{"i":50,"text":"«Guardala.»","italic":false},{"i":51,"text":"Sollevò una mano e la tese verso la sfera sospesa al centro.","italic":false},{"i":52,"text":"«Mari. Foreste. Montagne. Vita in forme che loro stessi non hanno ancora finito di comprendere. Hanno ricevuto un mondo che non hanno creato e si sono comportati come se ne fossero i padroni.»","italic":false},{"i":53,"text":"I suoi occhi rimasero fissi su di essa mentre sulla superficie appariva una distesa di alberi abbattuti.","italic":false},{"i":54,"text":"«Lo hanno scavato, avvelenato, consumato. E quando ciò che hanno non basta più, cercano qualcos'altro da consumare.»","italic":false},{"i":55,"text":"Odino lasciò passare qualche istante.","italic":false},{"i":56,"text":"«Non nego ciò che hai detto, Amaterasu. So che sanno amare. So che sanno sacrificarsi. So che sanno creare. Ma il loro potenziale non cancella le conseguenze delle loro azioni. Non possiamo continuare a giudicarli soltanto per ciò che potrebbero diventare mentre quel mondo continua a pagare per ciò che scelgono di essere.»","italic":false},{"i":57,"text":"Amaterasu non replicò.","italic":false},{"i":58,"text":"Per qualche istante rimase soltanto la Terra, lenta, davanti a noi.","italic":false},{"i":59,"text":"Fu Shiva a parlare.","italic":false},{"i":60,"text":"«Tutto ciò che nasce è destinato a finire. Un uomo. Un popolo. Una civiltà. Persino un mondo.»","italic":false},{"i":61,"text":"Nel suo tono non c'erano né accusa né difesa.","italic":false},{"i":62,"text":"«Ogni esistenza attraversa un ciclo. Nasce, cresce, cambia e, prima o poi, si compie. La domanda non è se l'umanità avrà una fine. La domanda è: quel momento è già arrivato?»","italic":false},{"i":63,"text":"Nessuno rispose.","italic":false},{"i":64,"text":"«Distruggono e ricostruiscono. Imparano e dimenticano. Proteggono ciò che amano e devastano ciò da cui dipendono. Questo potrebbe dimostrare che non cambieranno mai. Oppure che la loro trasformazione non sia ancora completa.»","italic":false},{"i":65,"text":"«E quanto dovrebbe durare questa trasformazione?» chiese Zeus.","italic":false},{"i":66,"text":"«Non lo so» rispose Shiva. «Ma non sapere se un ciclo sia concluso non significa avere il diritto di dichiararlo tale.»","italic":false},{"i":67,"text":"«Non la vedo così» esordì Anubi.","italic":false},{"i":68,"text":"Fino a quel momento era rimasto quasi immobile.","italic":false},{"i":69,"text":"«Se il tempo dell'umanità fosse davvero esaurito, la sua fine arriverebbe comunque. Ma non è ciò che stiamo facendo.»","italic":false},{"i":70,"text":"«Siamo qui proprio per questo» rispose Zeus. «Per prendere una decisione.»","italic":false},{"i":71,"text":"«Allora chiamiamola con il suo nome» disse Anubi. «Non stiamo assistendo alla fine dell'umanità. Stiamo decidendo se condannarla.»","italic":false},{"i":72,"text":"Le parole di Anubi rimasero sospese.","italic":false},{"i":73,"text":"Poi Zeus si alzò.","italic":false},{"i":74,"text":"«Ed è per assumere questa responsabilità che siamo stati convocati.»","italic":false},{"i":75,"text":"Lasciò passare un istante e sospirò.","italic":false},{"i":76,"text":"«Abbiamo ascoltato abbastanza.»","italic":false},{"i":77,"text":"Il tono non lasciava spazio a repliche.","italic":false},{"i":78,"text":"«Chi ritiene concluso il ciclo dell'umanità e giudica che sia giunto il momento di porvi fine, alzi la mano.»","italic":false},{"i":79,"text":"La Terra continuava a ruotare lentamente.","italic":false},{"i":80,"text":"Per alcuni secondi non accadde nulla.","italic":false},{"i":81,"text":"Poi una mano si alzò.","italic":false},{"i":82,"text":"Non vidi a chi appartenesse.","italic":false},{"i":83,"text":"Un'altra comparve poco distante. Poi una terza.","italic":false},{"i":84,"text":"Il movimento cominciò a propagarsi.","italic":false},{"i":85,"text":"Odino sollevò la propria senza esitazione. Zeus fece lo stesso.","italic":false},{"i":86,"text":"Altre seguirono.","italic":false},{"i":87,"text":"Prima poche.","italic":false},{"i":88,"text":"Poi decine.","italic":false},{"i":89,"text":"Sempre di più.","italic":false},{"i":90,"text":"Guardai Amaterasu. La sua rimase abbassata.","italic":false},{"i":91,"text":"Shiva non si mosse.","italic":false},{"i":92,"text":"Anubi osservava ciò che stava accadendo senza intervenire.","italic":false},{"i":93,"text":"Il voto continuava a diffondersi, settore dopo settore. Mi accorsi di stare contando e smisi.","italic":false},{"i":94,"text":"Abbassai gli occhi sulla mia.","italic":false},{"i":95,"text":"Non l'avevo ancora sollevata quando la voce del Padre attraversò la sala.","italic":false},{"i":96,"text":"«NO.»","italic":false},{"i":97,"text":"Non fu un grido.","italic":false},{"i":98,"text":"Non ne ebbe bisogno.","italic":false},{"i":99,"text":"La parola sembrò attraversare il pavimento sotto i miei piedi. La sentii risalire lungo le colonne, raggiungere la volta e propagarsi oltre quelle mura. Ebbi l'impressione che continuasse a scendere attraverso i livelli del Regno Celeste, sempre più in profondità.","italic":false},{"i":100,"text":"Le mani si abbassarono.","italic":false},{"i":101,"text":"Ogni movimento cessò.","italic":false},{"i":102,"text":"Tutti si voltarono verso il Padre.","italic":false},{"i":103,"text":"La Terra continuava a ruotare, ormai ignorata.","italic":false},{"i":104,"text":"Lui si sporse appena in avanti, il volto ancora nascosto dalla luce.","italic":false},{"i":105,"text":"«Non ho intenzione di assolverli. Ma avranno un'ultima possibilità.»","italic":false},{"i":106,"text":"Per un po', nessuno reagì.","italic":false},{"i":107,"text":"Poi arrivarono le prime domande.","italic":false},{"i":108,"text":"«Un'ultima possibilità?»","italic":true},{"i":109,"text":"«In che modo?»","italic":true},{"i":110,"text":"«Dopo ciò che abbiamo appena visto?»","italic":true},{"i":111,"text":"Le reazioni arrivarono da più punti. Zeus intervenne sopra le altre voci.","italic":false},{"i":112,"text":"«Hai appena interrotto una votazione.»","italic":false},{"i":113,"text":"«Perché esiste ancora qualcosa che non avete considerato» rispose il Padre.","italic":false},{"i":114,"text":"Le proteste diminuirono.","italic":false},{"i":115,"text":"«Cosa?» chiese Amaterasu.","italic":false},{"i":116,"text":"«La risposta si trova all'Inferno.»","italic":false},{"i":117,"text":"La reazione fu immediata.","italic":false},{"i":118,"text":"«All'Inferno?»","italic":true},{"i":119,"text":"«Che cosa può esserci laggiù?»","italic":true},{"i":120,"text":"«In che modo potrebbe cambiare il giudizio?»","italic":true},{"i":121,"text":"«Perché non ne siamo stati informati?»","italic":true},{"i":122,"text":"Altre domande si aggiunsero alle prime, sovrapponendosi fino a confondersi. In pochi istanti, l'ordine ristabilito qualche attimo prima si dissolse sotto il peso di un'intera assemblea che pretendeva spiegazioni.","italic":false},{"i":123,"text":"Io non dissi nulla.","italic":false},{"i":124,"text":"Continuai a osservare il Padre.","italic":false},{"i":125,"text":"Non si mosse. Lasciò che le voci crescessero ancora, finché non fu quasi impossibile distinguerne una dall'altra.","italic":false},{"i":126,"text":"Poi parlò.","italic":false},{"i":127,"text":"«BASTA.»","italic":false},{"i":128,"text":"Il brusio morì all'istante.","italic":false},{"i":129,"text":"«Non vi sto chiedendo di comprendere ciò che ancora non conoscete. Il mio giudizio dovrebbe bastarvi.»","italic":false},{"i":130,"text":"Nessuno replicò.","italic":false},{"i":131,"text":"«Quando sarà il momento, saprete ciò che dovete sapere. Per ora, è tutto.»","italic":false},{"i":132,"text":"Lasciò trascorrere una breve pausa.","italic":false},{"i":133,"text":"«Qualcuno dovrà scendere all'Inferno. E ho già scelto chi.»","italic":false},{"i":134,"text":"Nessuno parlò.","italic":false},{"i":135,"text":"La Terra continuava a ruotare lentamente, sospesa sopra di noi. Poco prima, centinaia di mani erano pronte a decretarne la fine.","italic":false},{"i":136,"text":"Ora nessuno la guardava più.","italic":false},{"i":137,"text":"Il Padre, quasi cancellato dalla luce, sollevò lentamente il capo. La sua attenzione scivolò sulle grandi divinità.","italic":false},{"i":138,"text":"Zeus.","italic":false},{"i":139,"text":"Amaterasu.","italic":false},{"i":140,"text":"Odino.","italic":false},{"i":141,"text":"Shiva.","italic":false},{"i":142,"text":"Anubi.","italic":false},{"i":143,"text":"Poi andò oltre.","italic":false},{"i":144,"text":"Verso di noi.","italic":false},{"i":145,"text":"Verso i Guardiani Celesti.","italic":false},{"i":146,"text":"L'attesa si fece quasi fisica. Nessuno parlava. Sembrava che persino il tempo avesse deciso di fermarsi.","italic":false},{"i":147,"text":"Infine, gli occhi del Padre incontrarono i miei.","italic":false},{"i":148,"text":"Mi sembrò di scorgere un sorriso, ma, a questo punto, potrei anche sbagliarmi.","italic":false},{"i":149,"text":"Oggi so che tutto ciò che venne dopo cominciò in quell'istante.","italic":false},{"i":150,"text":"Con un semplice nome.","italic":false},{"i":151,"text":"«GABRIEL.»","italic":false}],"arts":[{"after":5,"src":"/The-Last-Chance-READER/IMG_3829.jpeg","alt":"Zeus","cls":"portrait"},{"after":9,"src":"/The-Last-Chance-READER/F6C0BE3C-14C8-49B1-8B21-E5FB6E6CC5D5.jpeg","alt":"Anubi","cls":"portrait"},{"after":26,"src":"/The-Last-Chance-READER/CAP02_TERRA_PROIEZIONE.jpeg","alt":"La Terra proiettata al centro del Grande Concilio","cls":"wide"},{"after":39,"src":"/The-Last-Chance-READER/IMG_3830.jpeg","alt":"Amaterasu","cls":"portrait"},{"after":47,"src":"/The-Last-Chance-READER/IMG_3833.jpeg","alt":"Odino","cls":"portrait"},{"after":60,"src":"/The-Last-Chance-READER/IMG_3831.jpeg","alt":"Shiva","cls":"portrait"}]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([0,10,15,25,29,39,47,59,67,73,79,80,96,100,105,123,127,134,150,151]);
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;f.appendChild(im);return f}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");if(item.i===151)p.classList.add("final-name");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});const a=DATA.arts.find(x=>x.after===p.i);if(a)out.push({type:"art",...a})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break");if(item.i===151)p.classList.add("final-name"); page.d.appendChild(p); return p;
}
function paginate(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage();
 const items=buildItems();
 for(let idx=0;idx<items.length;idx++){
  const item=items[idx];
  if(item.type==="art"){
   // Do not reserve blank space on the current page just to keep the image beside its trigger.
   // If the page already contains prose, start the illustration on the next page.
   if(page.d.textContent.trim().length>0)page=makePage();
   const n=nodeFor(item);page.d.appendChild(n);
   if(!fits(page.d)){n.style.height="42dvh"}
   continue;
  }
  let full=nodeFor(item);page.d.appendChild(full);
  if(fits(page.d))continue;
  page.d.removeChild(full);
  const words=item.text.split(/\s+/);let pos=0,continuation=false;
  while(pos<words.length){
   let lo=1,hi=words.length-pos,best=0,test=null;
   while(lo<=hi){
    const mid=(lo+hi)>>1;if(test)test.remove();
    test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
    if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
   }
   if(test)test.remove();
   if(best===0){page=makePage();continue}
   appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
   pos+=best;continuation=true;
   if(pos<words.length)page=makePage();
  }
 }

const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap02-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP02 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML="<div><h2>Fine del Capitolo II</h2><p>THE LAST CHANCE</p></div>";track.appendChild(end);update()}
