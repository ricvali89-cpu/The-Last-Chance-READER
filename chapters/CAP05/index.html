t-fit:contain;box-shadow:0 6px 18px #0002}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

const DATA={"paragraphs":[{"i":0,"text":"I cinque giorni rimasti si ridussero presto a tre. Continuai a rivedere le disposizioni lasciate ai Guardiani, chiusi gli ultimi dettagli dell’equipaggiamento e mantenni il solito ritmo di allenamento. Ogni controllo portava allo stesso risultato: per ciò che dipendeva da me, restava ormai ben poco da sistemare.","italic":false},{"i":1,"text":"Le informazioni sull’Inferno erano un’altra cosa. Rilessi più volte i resoconti che avevo raccolto, cercando qualcosa che mi fosse sfuggito, ma trovai sempre lo stesso limite: potevano prepararmi a ciò che altri avevano visto, non a ciò che avrei incontrato io. Non sapevo in quali condizioni avrei raggiunto Vaelkar, né quali decisioni sarei stato costretto a prendere prima di arrivare da lui.","italic":false},{"i":2,"text":"Non era una questione di prepararmi meglio. Avevo quasi esaurito tutto ciò che potevo prevedere, organizzare o controllare. Quello che rimaneva fuori dal piano cominciava a pesare più del piano stesso.","italic":false},{"i":3,"text":"Fu allora che pensai a Uriel. Da quando avevo preso il suo posto ci vedevamo meno. Non abbastanza, però, da rendere formale una visita. Decisi di andare da lui.","italic":false},{"i":4,"text":"Quando lo raggiunsi, Uriel stava leggendo. Al mio ingresso sollevò gli occhi dal libro.","italic":false},{"i":5,"text":"«Gabriel.»","italic":false},{"i":6,"text":"«Uriel.»","italic":false},{"i":7,"text":"Con un cenno indicò la sedia davanti a sé. Mi sedetti.","italic":false},{"i":8,"text":"«Parto tra tre giorni.»","italic":false},{"i":9,"text":"La sua mano rimase ferma sul bordo della pagina. «Dove sei diretto?»","italic":false},{"i":10,"text":"«All’Inferno.»","italic":false},{"i":11,"text":"Uriel non rispose subito. Richiuse il libro e lo posò sul tavolo. «Capisco.»","italic":false},{"i":12,"text":"«Il Padre mi ha incaricato di raggiungere Vaelkar. Devo farmi consegnare un antico artefatto e riportarlo al Padre. Loki è già laggiù a preparare il percorso.»","italic":false},{"i":13,"text":"Uriel si appoggiò allo schienale. «E immagino che tu abbia passato gli ultimi giorni a sistemare tutto il resto.»","italic":false},{"i":14,"text":"«Quasi tutto.»","italic":false},{"i":15,"text":"«Quasi?»","italic":false},{"i":16,"text":"«È per questo che sono qui.»","italic":false},{"i":17,"text":"Uriel intrecciò le dita sul tavolo. «Quale parte della missione continua a sfuggirti?»","italic":false},{"i":18,"text":"«Non una parte precisa. È proprio questo il problema.» Mi presi un momento prima di continuare. «Ho preparato tutto ciò che posso. Ma una volta laggiù, gran parte di quello che ho pianificato dipenderà da cose che non conosco.»","italic":false},{"i":19,"text":"Uriel inclinò appena il capo. «E vorresti conoscerle prima di partire.»","italic":false},{"i":20,"text":"«Vorrei almeno sapere quali potrebbero essere.»","italic":false},{"i":21,"text":"«Non puoi.»","italic":false},{"i":22,"text":"«Lo so.»","italic":false},{"i":23,"text":"«Allora non è questo che sei venuto a chiedermi.»","italic":false},{"i":24,"text":"Rimasi in silenzio per qualche istante. «Forse voglio capire se c’è qualcosa che sto affrontando nel modo sbagliato.»","italic":false},{"i":25,"text":"Uriel si appoggiò di nuovo allo schienale. «Quando ti preparavo al comando, quante volte avevi tutte le informazioni che avresti voluto?»","italic":false},{"i":26,"text":"«Mai.»","italic":false},{"i":27,"text":"«E quante volte un piano è rimasto identico dall’inizio alla fine?»","italic":false},{"i":28,"text":"«Poche.»","italic":false},{"i":29,"text":"«Allora perché dovrebbe essere diverso questa volta?»","italic":false},{"i":30,"text":"«Perché questa volta le conseguenze di un errore potrebbero essere molto peggiori.»","italic":false},{"i":31,"text":"Uriel mantenne lo sguardo su di me. «Questo non rende l’ignoto più prevedibile.» Fece una breve pausa. «Un piano serve finché la realtà gli dà ragione. Quando smette di farlo, insistere non è disciplina.»","italic":false},{"i":32,"text":"«E se me ne accorgessi troppo tardi?»","italic":false},{"i":33,"text":"«Può succedere.» La risposta arrivò senza esitazione.","italic":false},{"i":34,"text":"«Non è molto rassicurante.»","italic":false},{"i":35,"text":"«Non sei venuto da me per essere rassicurato.»","italic":false},{"i":36,"text":"Su quello aveva ragione. «Il Padre si aspetta che torni con quell’artefatto.»","italic":false},{"i":37,"text":"«Quella è la missione. Il modo in cui pensi di riuscirci è il piano.» Uriel lasciò passare un istante. «Non confondere le due cose.»","italic":false},{"i":38,"text":"Rimasi a riflettere sulle sue parole. «Quindi, se quello che troverò laggiù renderà impossibile seguire le istruzioni alla lettera...»","italic":false},{"i":39,"text":"«Deciderai cosa fare. Come hai sempre fatto quando la situazione lo richiedeva.»","italic":false},{"i":40,"text":"Abbassai per un momento gli occhi verso il tavolo. C’era ancora una domanda che avevo evitato fin dall’inizio.","italic":false},{"i":41,"text":"«Pensi che il Padre abbia fatto bene a scegliere me?»","italic":false},{"i":42,"text":"Uriel non rispose immediatamente. «Non posso parlare al posto suo.» Si sistemò appena sulla sedia. «Ma se mi stai chiedendo se io ti avrei affidato una missione del genere, la risposta è sì.»","italic":false},{"i":43,"text":"«Anche senza sapere cosa mi aspetta?»","italic":false},{"i":44,"text":"«Soprattutto per questo.»","italic":false},{"i":45,"text":"Rimasi in silenzio.","italic":false},{"i":46,"text":"Uriel riprese il libro, ma non lo aprì. «Hai fatto tutto quello che potevi fare prima della partenza. Il resto comincerà quando sarai laggiù.»","italic":false},{"i":47,"text":"Annuii. Non c’era molto altro da aggiungere. Mi alzai dalla sedia. «Grazie.»","italic":false},{"i":48,"text":"Uriel fece un breve cenno. «Adesso vai. Hai ancora tre giorni.»","italic":false},{"i":49,"text":"Lasciai la stanza poco dopo. I dubbi non erano spariti. Ma avevo smesso di considerarli qualcosa che dovevo risolvere prima di partire.","italic":false},{"i":50,"text":"Il giorno seguente ero di nuovo nell’Arena degli Eroi. Sul piano centrale la polvere si sollevava a ogni cambio di direzione, mentre ai margini alcuni Guardiani si esercitavano con scudi e armi da addestramento. Per me quel posto non aveva nulla di solenne. Era uno spazio di lavoro, e quella mattina ne avevo bisogno più del solito.","italic":false},{"i":51,"text":"Stavo completando un’altra sequenza con la Spada quando una voce mi raggiunse dal bordo dell’arena.","italic":false},{"i":52,"text":"«Comandante.»","italic":false},{"i":53,"text":"Interruppi il movimento e mi voltai verso l’Araldo che mi aspettava poco oltre il limite del piano di combattimento. «Che succede?»","italic":false},{"i":54,"text":"«Brok e Sindri sono arrivati. Vi attendono nell’Atrio Principale.»","italic":false},{"i":55,"text":"Il regalo promesso dal Padre. «Hanno detto altro?»","italic":false},{"i":56,"text":"«Soltanto che devono consegnarvi qualcosa.»","italic":false},{"i":57,"text":"Non mi serviva sapere di più. Rimisi la Spada alla cinghia, passai un avambraccio sulla fronte e lasciai l’arena con ancora addosso la polvere dell’allenamento.","italic":false},{"i":58,"text":"L’Atrio Principale era l’esatto contrario: pietra chiara, ordine, luce e passaggi aperti in più direzioni. Brok e Sindri mi aspettavano in una zona laterale, lontani dal flusso principale.","italic":false},{"i":59,"text":"Li riconobbi subito. Brok era il più massiccio dei due, con le mani grandi segnate dal lavoro e l’aspetto di chi non aveva mai avuto particolare interesse per le formalità. Sindri, al suo fianco, era più asciutto e ordinato, come se perfino gli strumenti che portava con sé avessero un posto preciso.","italic":false},{"i":60,"text":"Non erano semplici fabbri. Tra le opere uscite dalle loro forge c’era Mjölnir, il martello di Thor: un’arma abbastanza celebre da rendere superflua qualsiasi spiegazione sul valore di chi l’aveva costruita.","italic":false},{"i":61,"text":"Brok mi squadrò appena mentre mi avvicinavo. «Comandante.»","italic":false},{"i":62,"text":"«Brok. Sindri.»","italic":false},{"i":63,"text":"Sindri ricambiò il saluto con un cenno più misurato. «Immagino sappiate perché siamo qui.»","italic":false},{"i":64,"text":"«Il Padre mi aveva anticipato che avrei ricevuto qualcosa da voi.»","italic":false},{"i":65,"text":"«Allora ci risparmia una parte della spiegazione» disse Brok.","italic":false},{"i":66,"text":"Sindri disse: «Siamo qui per consegnarvi il regalo che ci è stato commissionato.»","italic":false},{"i":67,"text":"Prese la collana e me la porse. Era pesante alla vista prima ancora che al tatto. Le maglie erano spesse e angolari, in metallo scuro con finiture più calde. Al centro pendeva una struttura geometrica massiccia che racchiudeva una gemma rossa sfaccettata.","italic":false},{"i":68,"text":"La presi. Non accadde nulla.","italic":false},{"i":69,"text":"«È questo il regalo?»","italic":false},{"i":70,"text":"«È questo» rispose Brok.","italic":false},{"i":71,"text":"Guardai di nuovo il pendaglio. «A cosa serve?»","italic":false},{"i":72,"text":"Sindri spiegò: «L’Inferno esercita una pressione su chi lo attraversa. Questo ne attenuerà una parte e vi aiuterà a resistere durante la discesa.»","italic":false},{"i":73,"text":"«Quanto?»","italic":false},{"i":74,"text":"«Abbastanza da fare la differenza. Non abbastanza da rendervi immune.»","italic":false},{"i":75,"text":"Brok incrociò le braccia. «Se qualcuno vi colpisce, continuerà a far male.»","italic":false},{"i":76,"text":"Gli rivolsi un’occhiata.","italic":false},{"i":77,"text":"«Era per essere chiari.»","italic":false},{"i":78,"text":"«Devo fare qualcosa per attivarla?» chiesi a Sindri.","italic":false},{"i":79,"text":"«No. Tenetela con voi. Farà ciò per cui è stata costruita.»","italic":false},{"i":80,"text":"Continuai a osservare il pendaglio. «È tutto ciò che fa?»","italic":false},{"i":81,"text":"Sindri non cercò di evitare la domanda. «No.»","italic":false},{"i":82,"text":"Alzai gli occhi su di lui. «Cos’altro?»","italic":false},{"i":83,"text":"«Non possiamo dirvelo.»","italic":false},{"i":84,"text":"«Non potete o non volete?»","italic":false},{"i":85,"text":"«Non possiamo» precisò Sindri. «Il Padre ci ha ordinato di non rivelarvi altro.»","italic":false},{"i":86,"text":"«Quindi dovrei portare con me un oggetto di cui conosco soltanto una parte delle funzioni.»","italic":false},{"i":87,"text":"«Esatto» disse Brok.","italic":false},{"i":88,"text":"Sindri aggiunse: «Ciò che vi abbiamo spiegato è vero. La collana vi aiuterà durante la discesa. Per il resto, dovrete attenervi alle disposizioni del Padre.»","italic":false},{"i":89,"text":"Passai la collana attorno al collo e sistemai il pendaglio sotto gli abiti. Nessuna luce, nessun calore. Solo il peso del metallo contro il petto. «Va bene. La terrò con me.»","italic":false},{"i":90,"text":"Sindri annuì. «È sufficiente.» Si preparò a congedarsi, ma Brok rimase a guardarmi ancora per un momento.","italic":false},{"i":91,"text":"«Un’ultima cosa, Comandante.»","italic":false},{"i":92,"text":"«Dimmi.»","italic":false},{"i":93,"text":"Mi squadrò dalla testa ai piedi. «Se prima di partire decidete di presentarvi in condizioni un po’ più dignitose, passate da noi. Qualcosa riusciamo ancora a fare.»","italic":false},{"i":94,"text":"Sindri gli rivolse uno sguardo torvo.","italic":false},{"i":95,"text":"Brok alzò le spalle. «Il Comandante è sempre ben accetto.» Si avviò, poi aggiunse: «Su prenotazione, naturalmente.»","italic":false},{"i":96,"text":"Sindri scosse appena il capo e i due si allontanarono lungo l’atrio.","italic":false},{"i":97,"text":"Poi ripresi l’allenamento nell’Arena, con la collana nascosta sotto gli abiti.","italic":false},{"i":98,"text":"Il resto della giornata trascorse tra gli ultimi incarichi e ciò che richiedeva ancora la mia presenza. Quando rientrai nella mia stanza, non restava quasi più nulla da sistemare.","italic":false},{"i":99,"text":"Alla partenza mancava un solo giorno.","italic":false}],"arts":[{"after":37,"src":"/The-Last-Chance-READER/chapters/CAP05/CAP05_ILL_01_GABRIEL_URIEL_DEFINITIVA.jpeg?v=86ba086d","alt":"Gabriel e Uriel durante il confronto prima della missione","cls":"square"},{"after":67,"src":"/The-Last-Chance-READER/chapters/CAP05/CAP05_ILL_02_GABRIEL_BROK_SINDRI_DEFINITIVA.jpeg?v=a038f22e","alt":"Sindri consegna a Gabriel la collana nanica mentre Brok osserva","cls":"square"}]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([4,50,58,97]);
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;f.appendChild(im);return f}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});const a=DATA.arts.find(x=>x.after===p.i);if(a)out.push({type:"art",...a})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo V</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP04/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()
}

let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap05-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP05 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo V</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP04/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()}
