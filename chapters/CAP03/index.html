t-fit:contain;box-shadow:0 6px 18px #0002}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP03/CAP03_LA_SCELTA_DEL_PADRE_OPENING_DEFINITIVA.jpeg?v=70205abf" alt="Capitolo III — La Scelta del Padre"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"paragraphs":[{"i":0,"text":"La lama fendette l’aria con un sibilo secco.","italic":false},{"i":1,"text":"Un passo avanti. Rotazione del polso. Affondo.","italic":false},{"i":2,"text":"Mi fermai un istante, poi ricominciai.","italic":false},{"i":3,"text":"Non avevo bisogno di allenarmi. Non davvero. Dopo tutti quegli anni, certi movimenti appartenevano al mio corpo quanto respirare. Ma ripeterli mi aiutava a tenere la mente occupata.","italic":false},{"i":4,"text":"O almeno, di solito funzionava.","italic":false},{"i":5,"text":"Quella mattina no.","italic":false},{"i":6,"text":"Cambiai presa, arretrai di mezzo passo e colpii di nuovo.","italic":false},{"i":7,"text":"«Gabriel.»","italic":false},{"i":8,"text":"La voce del Padre continuava a tornarmi in mente.","italic":false},{"i":9,"text":"Una sola parola.","italic":false},{"i":10,"text":"Il mio nome.","italic":false},{"i":11,"text":"Erano passati diversi giorni dal Grande Concilio e ancora non capivo perché avesse scelto proprio me.","italic":false},{"i":12,"text":"La destinazione, invece, mi sembrava evidente.","italic":false},{"i":13,"text":"L’Inferno.","italic":false},{"i":14,"text":"Tutto il resto era rimasto sospeso.","italic":false},{"i":15,"text":"Non conoscevo il mio incarico, né quanto tempo sarei rimasto lontano dal Regno Celeste. E soprattutto non sapevo cosa mi aspettasse una volta laggiù.","italic":false},{"i":16,"text":"Portai un altro colpo.","italic":false},{"i":17,"text":"Sbagliai di nuovo.","italic":false},{"i":18,"text":"Mi fermai e abbassai la Spada.","italic":false},{"i":19,"text":"Era già la terza volta. Durante un allenamento non mi capitava quasi mai, e la cosa cominciava a irritarmi.","italic":false},{"i":20,"text":"Inspirai lentamente e tornai in posizione.","italic":false},{"i":21,"text":"Il problema non era scendere all’Inferno.","italic":false},{"i":22,"text":"Se il Padre aveva deciso che dovevo andarci, ci sarei andato.","italic":false},{"i":23,"text":"Il problema era ignorare cosa mi aspettasse una volta arrivato.","italic":false},{"i":24,"text":"Affrontare un nemico era semplice. Affrontare l’ignoto lo era molto meno.","italic":false},{"i":25,"text":"E poi c’erano i Guardiani.","italic":false},{"i":26,"text":"Se fossi rimasto lontano per giorni, forse settimane, qualcuno avrebbe dovuto occuparsi del comando in mia assenza. Turni, pattuglie, addestramento, sicurezza del Regno. Non erano questioni che potevo sistemare pochi minuti prima di partire.","italic":false},{"i":27,"text":"Avrei potuto iniziare subito. Convocare i miei ufficiali, distribuire incarichi, predisporre ogni cosa per la mia assenza.","italic":false},{"i":28,"text":"Sarebbe stato un ottimo modo per creare confusione senza conoscere nemmeno la durata della missione.","italic":false},{"i":29,"text":"Lasciai uscire lentamente il fiato.","italic":false},{"i":30,"text":"No.","italic":false},{"i":31,"text":"Il Padre mi aveva fatto attendere per una ragione.","italic":false},{"i":32,"text":"Quando avesse ritenuto che fosse arrivato il momento, mi avrebbe chiamato. Fino ad allora, il mio compito non cambiava.","italic":false},{"i":33,"text":"Rimisi la Spada in posizione.","italic":false},{"i":34,"text":"Fu allora che sentii dei passi alle mie spalle.","italic":false},{"i":35,"text":"Mi voltai.","italic":false},{"i":36,"text":"Due Araldi erano fermi all’ingresso dell’area di addestramento.","italic":false},{"i":37,"text":"Alti e immobili, indossavano lunghi mantelli scuri percorsi da sottili decorazioni metalliche. I cappucci scendevano tanto in profondità da lasciare i loro volti quasi interamente nell’ombra. Non avevano bisogno di presentarsi. Quell’aspetto austero bastava a renderli immediatamente riconoscibili.","italic":false},{"i":38,"text":"Uno dei due chinò appena il capo.","italic":false},{"i":39,"text":"«Comandante Gabriel. Il Padre vi attende.»","italic":false},{"i":40,"text":"Per qualche secondo rimasi immobile.","italic":false},{"i":41,"text":"Poi abbassai la Spada.","italic":false},{"i":42,"text":"A quanto pare, il momento era arrivato.","italic":false},{"i":43,"text":"I due si voltarono senza aggiungere altro.","italic":false},{"i":44,"text":"Li seguii.","italic":false},{"i":45,"text":"Lasciammo l’area di addestramento e imboccammo uno dei grandi corridoi che attraversavano il palazzo.","italic":false},{"i":46,"text":"A quell’ora erano tutt’altro che vuoti. Guardiani, servitori e funzionari si spostavano tra le diverse ali dell’edificio, mentre dalle arcate aperte entrava una luce così intensa da riflettersi sul pavimento chiaro.","italic":false},{"i":47,"text":"Al nostro passaggio, le conversazioni si interrompevano.","italic":false},{"i":48,"text":"Qualcuno si limitava a chinare il capo. Altri si fermavano e si inchinavano mentre passavo.","italic":false},{"i":49,"text":"Rispondevo con un cenno e continuavo a camminare.","italic":false},{"i":50,"text":"Era così da quando avevo assunto il comando. All’inizio avevo impiegato un po’ ad abituarmici. Ora quasi non ci facevo più caso.","italic":false},{"i":51,"text":"Proseguimmo in silenzio.","italic":false},{"i":52,"text":"Più avanzavamo, più il movimento intorno a noi diminuiva. I corridoi diventavano più ampi e le voci più lontane, finché rimase soltanto il rumore dei nostri passi.","italic":false},{"i":53,"text":"Poi i due si fermarono.","italic":false},{"i":54,"text":"Non serviva che mi dicessero perché.","italic":false},{"i":55,"text":"Davanti all’accesso alle stanze del Padre c’erano due Protettori del Trono.","italic":false},{"i":56,"text":"Era difficile confonderli con qualsiasi altro Guardiano.","italic":false},{"i":57,"text":"Erano enormi.","italic":false},{"i":58,"text":"Le armature chiare ricoprivano quasi interamente i loro corpi. La luce scivolava sulle piastre levigate, rendendoli ancora più imponenti. Gli elmi chiusi nascondevano i volti, mentre le ali, raccolte dietro le spalle, sembravano ancora più grandi per la loro stazza.","italic":false},{"i":59,"text":"Ognuno impugnava una lunga alabarda.","italic":false},{"i":60,"text":"Non erano sotto il mio comando.","italic":false},{"i":61,"text":"I Protettori del Trono rispondevano soltanto al Padre.","italic":false},{"i":62,"text":"I due si fecero da parte.","italic":false},{"i":63,"text":"Feci per avanzare.","italic":false},{"i":64,"text":"Una delle due alabarde si abbassò davanti a me.","italic":false},{"i":65,"text":"Mi fermai.","italic":false},{"i":66,"text":"Uno degli Araldi avanzò di mezzo passo.","italic":false},{"i":67,"text":"«Il Comandante Gabriel è stato convocato dal Padre.»","italic":false},{"i":68,"text":"La guardia rimase immobile per qualche istante, poi sollevò la sua lunga arma.","italic":false},{"i":69,"text":"«Può passare.»","italic":false},{"i":70,"text":"Feci un passo.","italic":false},{"i":71,"text":"Il suo sguardo si fermò sulla mia schiena.","italic":false},{"i":72,"text":"Mi sbarrò di nuovo la strada.","italic":false},{"i":73,"text":"«La Spada no.»","italic":false},{"i":74,"text":"Abbassai lo sguardo verso l’arma, poi tornai a guardare il Protettore.","italic":false},{"i":75,"text":"Conoscevo il protocollo.","italic":false},{"i":76,"text":"Portai una mano all’elsa e sfilai la Spada dalla cinghia.","italic":false},{"i":77,"text":"«Dovrete tenerla voi.»","italic":false},{"i":78,"text":"Il Protettore tese una mano.","italic":false},{"i":79,"text":"Gliela porsi, senza fretta. Aspettai che le sue dita si chiudessero saldamente sull’impugnatura.","italic":false},{"i":80,"text":"«Presa?»","italic":false},{"i":81,"text":"Fece un cenno.","italic":false},{"i":82,"text":"Lasciai l’elsa.","italic":false},{"i":83,"text":"Il suo peso lo trascinò immediatamente verso il basso.","italic":false},{"i":84,"text":"La Spada colpì il pavimento con un tonfo sordo.","italic":false},{"i":85,"text":"Rimase immobile per un momento, lo sguardo inequivocabilmente stupito.","italic":false},{"i":86,"text":"Poi si chinò. Piantò bene i piedi a terra, strinse entrambe le mani attorno all’impugnatura e tirò con tutta la forza.","italic":false},{"i":87,"text":"Non si mosse.","italic":false},{"i":88,"text":"Mi chinai e afferrai l’elsa.","italic":false},{"i":89,"text":"La sollevai con una mano e la rimisi al suo posto.","italic":false},{"i":90,"text":"«Questa Spada mi è stata affidata dal Padre.»","italic":false},{"i":91,"text":"Il Protettore tornò a guardarmi.","italic":false},{"i":92,"text":"«Se desidera che me ne separi, dovrà essere lui a chiedermelo.»","italic":false},{"i":93,"text":"Rimase in silenzio per qualche secondo.","italic":false},{"i":94,"text":"Poi sollevò l’alabarda.","italic":false},{"i":95,"text":"Il passaggio era libero.","italic":false},{"i":96,"text":"Le grandi porte si aprirono.","italic":false},{"i":97,"text":"La luce mi investì appena entrai. Socchiusi gli occhi, ma continuai a camminare.","italic":false},{"i":98,"text":"All’inizio vidi soltanto bianco e oro. Poi i contorni tornarono nitidi e le colonne ai lati ricomparvero una dopo l’altra, segnando il lungo percorso verso la scalinata lontana.","italic":false},{"i":99,"text":"Conoscevo bene quella sala. Eppure, vista da lì, la distanza fino al trono sembrava ogni volta più grande di quanto ricordassi.","italic":false},{"i":100,"text":"L’aria era leggermente più fresca.","italic":false},{"i":101,"text":"Si sentiva appena un odore di legno antico e resina, accompagnato da quella nota pulita e quasi elettrica che resta dopo un temporale.","italic":false},{"i":102,"text":"Ogni mio passo produceva un’eco lunga, destinata a spegnersi prima del successivo.","italic":false},{"i":103,"text":"In fondo, i gradini cominciavano ormai a distinguersi uno dall’altro.","italic":false},{"i":104,"text":"Il Padre sedeva in alto, con la raggiera alle spalle.","italic":false},{"i":105,"text":"Il controluce ne definiva la figura, ma lasciava parte del volto nell’ombra. I lunghi capelli chiari raccoglievano i riflessi provenienti da dietro di lui, mentre la barba e i dettagli dorati delle vesti emergevano poco alla volta. Eppure quell’effetto bastava a renderlo meno familiare. Non era una novità.","italic":false},{"i":106,"text":"Quando raggiunsi la base, mi inginocchiai.","italic":false},{"i":107,"text":"Nessuno parlò.","italic":false},{"i":108,"text":"Aspettai che fosse lui a rompere il silenzio.","italic":false},{"i":109,"text":"«Non ti ho convocato subito dopo il Concilio.»","italic":false},{"i":110,"text":"«Presumo aveste le vostre ragioni.»","italic":false},{"i":111,"text":"«Le avevo. Alzati, Gabriel.»","italic":false},{"i":112,"text":"Obbedii e mi rimisi in piedi.","italic":false},{"i":113,"text":"«Hai avuto tempo per chiederti perché abbia scelto te.»","italic":false},{"i":114,"text":"«Sì» risposi. «Ma finché non conosco la missione, ogni risposta resta un’ipotesi.»","italic":false},{"i":115,"text":"«Il tuo grado non è il motivo della mia decisione. E neppure la forza» disse il Padre. «Non mi serviva semplicemente il più forte, né bastava il fatto che tu fossi il Comandante. Prima di tutto, non sei una divinità. Questo ti permette di raggiungere luoghi che per gli dèi comporterebbero conseguenze che non posso ignorare.»","italic":false},{"i":116,"text":"«Quindi non sono l’unico che potrebbe farlo.»","italic":false},{"i":117,"text":"«No. Era soltanto il primo requisito. Avevo bisogno di qualcuno capace di eseguire un ordine senza smettere di valutare la situazione. Potresti trovarti con istruzioni incomplete. In quel caso dovrai decidere da solo e rispondere delle tue scelte.»","italic":false},{"i":118,"text":"«E ritenete che io sia quella persona.»","italic":false},{"i":119,"text":"«Sì» disse il Padre. «Mi fido del tuo giudizio, Gabriel.»","italic":false},{"i":120,"text":"Non lo presi come un elogio. Quelle parole aumentarono il peso dell’incarico, non lo alleggerirono.","italic":false},{"i":121,"text":"«Sai già dove andrai.»","italic":false},{"i":122,"text":"Non era una domanda.","italic":false},{"i":123,"text":"«All’Inferno» risposi.","italic":false},{"i":124,"text":"«Sì. Sarai tu a scendere.»","italic":false},{"i":125,"text":"La conferma non mi sorprese.","italic":false},{"i":126,"text":"«E una volta lì, qual è il mio compito?»","italic":false},{"i":127,"text":"«Raggiungere Vaelkar. Lo troverai nelle profondità. Ti presenterai in mio nome. Dovrà consegnarti un oggetto da cui dipende l’ultima possibilità dell’umanità. Tu me lo riporterai.»","italic":false},{"i":128,"text":"«Che oggetto?»","italic":false},{"i":129,"text":"«Un antico artefatto» rispose il Padre. «Sarà lui a sapere cosa darti.»","italic":false},{"i":130,"text":"«E in che modo dovrebbe aiutarci?» chiesi.","italic":false},{"i":131,"text":"«Da solo, in nessun modo. Ma mi servirà per ciò che intendo fare dopo.»","italic":false},{"i":132,"text":"Non insistetti.","italic":false},{"i":133,"text":"«C’è un’altra cosa che devi sapere» riprese il Padre. «Loki è già nell’Inferno.»","italic":false},{"i":134,"text":"Quella informazione, invece, non me l’aspettavo.","italic":false},{"i":135,"text":"«Loki? È una divinità. Come ha fatto a entrare?»","italic":false},{"i":136,"text":"«Porta un bracciale che sopprime temporaneamente la sua natura divina» spiegò il Padre. «È così che ha potuto attraversare il confine. L’ho mandato avanti per aprirti la strada, studiare il percorso e individuare i pericoli.»","italic":false},{"i":137,"text":"«Mi accompagnerà?»","italic":false},{"i":138,"text":"«Non fino a Vaelkar. Il suo compito è preparare la tua discesa. Quando avrà finito, tornerà indietro.»","italic":false},{"i":139,"text":"«Perché non lasciare a lui il recupero dell’artefatto?»","italic":false},{"i":140,"text":"«Quello non è il suo incarico. L’ho affidato a te.»","italic":false},{"i":141,"text":"«Quando sarai laggiù, non dare per scontato che la forza sia sempre la risposta» disse il Padre.","italic":false},{"i":142,"text":"«Se qualcuno mi attaccherà, reagirò.»","italic":false},{"i":143,"text":"«Se sarà necessario. Ma non ogni ostacolo è un nemico da abbattere.»","italic":false},{"i":144,"text":"«Sapete cosa potrei incontrare?» chiesi.","italic":false},{"i":145,"text":"«Non con certezza. Per questo dovrai osservare prima di agire. Non ti mando laggiù perché sai combattere, Gabriel. Ti mando perché sai quando non farlo.»","italic":false},{"i":146,"text":"«Ho capito.»","italic":false},{"i":147,"text":"«Bene. Tienilo a mente.»","italic":false},{"i":148,"text":"«Da oggi hai una settimana» disse il Padre.","italic":false},{"i":149,"text":"Per la prima volta da quando ero entrato, avevo un termine preciso. Quel margine bastava per scegliere chi avrebbe guidato i Guardiani in mia assenza, sistemare gli incarichi, allenarmi e predisporre ciò che mi sarebbe servito per la discesa.","italic":false},{"i":150,"text":"«Prima di allora riceverai un mio regalo. Saranno i nani a consegnartelo.»","italic":false},{"i":151,"text":"La parola regalo, dopo tutto ciò che avevamo appena discusso, mi parve insolita.","italic":false},{"i":152,"text":"«Che cosa mi consegneranno?» domandai.","italic":false},{"i":153,"text":"«Qualcosa che ti sarà utile laggiù» rispose il Padre.","italic":false},{"i":154,"text":"Annuii.","italic":false},{"i":155,"text":"«Tra sette giorni partirai, Gabriel.»","italic":false},{"i":156,"text":"Il Padre mi concesse qualche istante prima di parlare di nuovo.","italic":false},{"i":157,"text":"«Hai altre domande?»","italic":false},{"i":158,"text":"Ne avevo ancora, ma nessuna che avesse senso porre in quel momento.","italic":false},{"i":159,"text":"«No» risposi. «Per ora ho ciò che mi serve.»","italic":false},{"i":160,"text":"«Bene» disse il Padre.","italic":false},{"i":161,"text":"«Sarò pronto.»","italic":false},{"i":162,"text":"«Lo so.» Fece una breve pausa. «Puoi andare.»","italic":false},{"i":163,"text":"Mi inchinai e mi voltai verso l’uscita.","italic":false},{"i":164,"text":"Attraversai la sala senza aggiungere altro.","italic":false},{"i":165,"text":"Le grandi porte si richiusero alle mie spalle.","italic":false},{"i":166,"text":"Ora sapevo cosa fare.","italic":false},{"i":167,"text":"Rientrai nella mia stanza.","italic":false},{"i":168,"text":"C’era parecchio da organizzare, ma per alcuni minuti accantonai il resto e riordinai le idee. Poi tolsi la Spada con un gesto ormai automatico. La prospettiva di portarla all’Inferno mi fece indugiare.","italic":false},{"i":169,"text":"Faceva parte della mia vita da anni, ben prima della nomina a Comandante dei Guardiani Celesti. Da allora erano cambiati doveri, rapporti, perfino il modo in cui gli altri si rivolgevano a me. Lei, invece, no.","italic":false},{"i":170,"text":"All’inizio quella familiarità mi aveva incuriosito. Averla accanto era inspiegabilmente naturale, come se fosse sempre stata lì. Cercai a lungo una ragione, inutilmente. A un certo punto smisi.","italic":false},{"i":171,"text":"Il pensiero si spinse molto più indietro, verso un tempo in cui quel grado e quelle responsabilità non mi appartenevano.","italic":false},{"i":172,"text":"Ricordavo ancora perfettamente il giorno in cui l’avevo presa tra le mani.","italic":false}],"arts":[{"after":55,"src":"/The-Last-Chance-READER/chapters/CAP03/CAP03_ILL_02_PROTETTORI_DEFINITIVA.jpeg?v=ec6eda67","alt":"Gabriel davanti ai Protettori del Trono","cls":"square"},{"after":106,"src":"/The-Last-Chance-READER/chapters/CAP03/CAP03_ILL_03_TRONO_DEFINITIVA.jpeg?v=10649ffe","alt":"Gabriel inginocchiato davanti al Padre nella Sala del Trono","cls":"square"},{"after":168,"src":"/The-Last-Chance-READER/chapters/CAP03/CAP03_ILL_04_VERITAS_DEFINITIVA.jpeg?v=5a360b56","alt":"Gabriel osserva Veritas nella propria stanza","cls":"square"}]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");

function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo III</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP02/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap03-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP03 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo III</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP02/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
</script><script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/The-Last-Chance-READER/sw.js",{scope:"/The-Last-Chance-READER/",updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));}
</script></body></html>
