t-fit:contain;box-shadow:0 6px 18px #0002}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP04/CAP04_LA_CICATRICE_NERA_OPENING_DEFINITIVA.jpeg?v=b17dbde2" alt="Capitolo IV — La Cicatrice Nera" draggable="false"></section></main><div class="controls" id="controls"><button id="prev" aria-label="Pagina precedente">‹</button><span id="counter">1 / 1</span><button id="next" aria-label="Pagina successiva">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"items":[{"type":"sep","symbol":"*"},{"type":"p","i":0,"text":"Tiro la cinghia finché la mia spada aderisce bene alla schiena. Muovo appena una spalla, controllo che non abbia gioco e lascio andare la fibbia. È a posto.","italic":false,"final":false},{"type":"p","i":1,"text":"Uriel ci vuole nella corte prima dell’arrivo delle delegazioni. Non ha ancora fatto il briefing, ma so già perché siamo stati richiamati tutti in servizio.","italic":false,"final":false},{"type":"p","i":2,"text":"La Spada.","italic":false,"final":false},{"type":"p","i":3,"text":"Da giorni il suo ritrovamento è diventato l’argomento preferito di mezzo Regno Celeste. Alcuni minatori l’hanno trovata durante degli scavi a Nidavellir e, a quanto pare, nessuno è riuscito a brandirla. All’inizio la cosa mi ha incuriosito. Poi tra i nomi di chi aveva tentato è comparso quello di Thor.","italic":false,"final":false},{"type":"p","i":4,"text":"Quello ha reso le voci molto più difficili da ignorare.","italic":false,"final":false},{"type":"p","i":5,"text":"Se nemmeno lui è riuscito a sollevarla, forse la forza non c’entra affatto. Ed è questo, più della Spada stessa, che continua a tornarmi in mente.","italic":false,"final":false},{"type":"p","i":6,"text":"L’arma è passata dalle mani dei nani a Brok e Sindri, poi a Odino e infine al Padre. Ora si trova qui, nel Regno Celeste, e tra poco divinità e guerrieri provenienti da più reami proveranno a fare ciò che Thor non è riuscito a fare. Io, invece, non l’ho ancora nemmeno vista.","italic":false,"final":false},{"type":"p","i":7,"text":"Raccolgo ciò che mi serve e mi dirigo verso l’uscita. La curiosità c’è, inutile negarlo, ma non cambia il motivo per cui sono stato convocato. Non devo partecipare alla Sfida.","italic":false,"final":false},{"type":"p","i":8,"text":"Sono un Guardiano.","italic":false,"final":false},{"type":"p","i":9,"text":"Oggi devo soltanto fare il mio lavoro.","italic":false,"final":false},{"type":"p","i":10,"text":"Quando raggiungo l’accesso alla corte, Uriel ha già quasi finito. Gli altri Guardiani si stanno distribuendo nei settori assegnati e, nel giro di pochi istanti, rimaniamo soltanto noi due.","italic":false,"final":false},{"type":"p","i":11,"text":"Il Comandante mi rivolge uno dei suoi soliti sguardi rapidi. Capelli grigio cenere, barba corta, portamento ancora perfettamente diritto. Con Uriel non servono molti gesti per capire quando sta dando un ordine.","italic":false,"final":false},{"type":"p","i":12,"text":"«Tu resti mobile.»","italic":false,"final":false},{"type":"p","i":13,"text":"Annuisco.","italic":false,"final":false},{"type":"p","i":14,"text":"«Controlla l’area generale. Accessi, pubblico, candidati. Se succede qualcosa, intervieni dove serve.»","italic":false,"final":false},{"type":"p","i":15,"text":"«E la custodia?»","italic":false,"final":false},{"type":"p","i":16,"text":"«Non è il tuo posto» risponde subito. «Ci sono già Guardiani assegnati. Tu mi servi libero di muoverti.»","italic":false,"final":false},{"type":"p","i":17,"text":"«Ricevuto.»","italic":false,"final":false},{"type":"p","i":18,"text":"Mi osserva ancora per un momento.","italic":false,"final":false},{"type":"p","i":19,"text":"«Oggi la corte sarà piena di persone importanti. Basta poco perché un problema semplice diventi complicato. Non farti distrarre.»","italic":false,"final":false},{"type":"p","i":20,"text":"Non serve chiedergli da cosa.","italic":false,"final":false},{"type":"p","i":21,"text":"«Non succederà.»","italic":false,"final":false},{"type":"p","i":22,"text":"Uriel accenna un cenno d’assenso.","italic":false,"final":false},{"type":"p","i":23,"text":"«È quello che mi aspetto.»","italic":false,"final":false},{"type":"p","i":24,"text":"Poi si volta verso la corte.","italic":false,"final":false},{"type":"p","i":25,"text":"È il momento di entrare.","italic":false,"final":false},{"type":"p","i":26,"text":"Varco l’accesso poco dopo Uriel.","italic":false,"final":false},{"type":"p","i":27,"text":"La corte è già quasi piena. Le delegazioni occupano le logge laterali, mentre più in basso candidati e Guardiani continuano a prendere posizione. Sopra di noi non c’è alcuna copertura: soltanto il cielo del Regno Celeste, aperto tra le strutture chiare che delimitano i lati.","italic":false,"final":false},{"type":"p","i":28,"text":"In fondo, oltre la lunga distesa di pavimento, il Padre è già al proprio posto sulla scalinata. La raggiera alle sue spalle lo rende riconoscibile anche da questa distanza. Al centro della corte, su un podio basso, c’è la custodia.","italic":false,"final":false},{"type":"p","i":29,"text":"Per un momento la osservo.","italic":false,"final":false},{"type":"p","i":30,"text":"È troppo lontana perché riesca a vedere davvero la Spada. Distinguo l’alloggiamento aperto e poco altro.","italic":false,"final":false},{"type":"p","i":31,"text":"Mi sposto verso il settore assegnato, lasciando libero l’asse centrale. Attorno a me il movimento rallenta poco alla volta: gli ultimi candidati raggiungono la zona d’attesa, le delegazioni si sistemano e i Guardiani prendono le proprie posizioni.","italic":false,"final":false},{"type":"p","i":32,"text":"Poi il Padre lascia la scalinata.","italic":false,"final":false},{"type":"p","i":33,"text":"Attraversa lentamente l’asse centrale e raggiunge il podio. Si ferma dall’altra parte della custodia, di fronte alla zona riservata ai candidati.","italic":false,"final":false},{"type":"p","i":34,"text":"Le ultime voci si spengono una dopo l’altra.","italic":false,"final":false},{"type":"p","i":35,"text":"Quando il Padre si volta verso la corte, ormai nessuno parla più.","italic":false,"final":false},{"type":"p","i":36,"text":"Il Padre lascia scorrere lo sguardo sulla corte prima di parlare.","italic":false,"final":false},{"type":"p","i":37,"text":"«Vi ho convocati qui per una ragione che ormai conoscete tutti. Da quando questa Spada è stata trovata, nessuno di coloro che ha provato a brandirla è riuscito a farlo.»","italic":false,"final":false},{"type":"p","i":38,"text":"La sua voce attraversa la corte senza bisogno di essere alzata.","italic":false,"final":false},{"type":"p","i":39,"text":"«Non sappiamo cosa le impedisca di essere sollevata, né perché fino a oggi abbia respinto chiunque ci abbia provato. Sappiamo soltanto che la forza, da sola, non è bastata. Per questo ho chiesto ai Regni di inviare coloro che ritenevano degni di tentare.»","italic":false,"final":false},{"type":"p","i":40,"text":"Fa una breve pausa, poi indica la custodia davanti a sé.","italic":false,"final":false},{"type":"p","i":41,"text":"«La prova sarà semplice. Sarete chiamati uno alla volta. Raggiungerete il podio, prenderete l’impugnatura e proverete a sollevare la Spada. Se non ci riuscirete, lascerete il posto al candidato successivo.»","italic":false,"final":false},{"type":"p","i":42,"text":"Il Padre torna a rivolgersi all’intera corte.","italic":false,"final":false},{"type":"p","i":43,"text":"«Non vi è stato chiesto di dimostrare chi sia il più forte, né chi abbia il nome più importante. Siamo qui per trovare qualcuno capace di fare ciò che, fino a questo momento, nessun altro è riuscito a fare.»","italic":false,"final":false},{"type":"p","i":44,"text":"Per un istante non si sente nulla.","italic":false,"final":false},{"type":"p","i":45,"text":"«Chiunque sia quella persona, oggi avrà la possibilità di dimostrarlo davanti a tutti.»","italic":false,"final":false},{"type":"p","i":46,"text":"Il Padre porta una mano verso la custodia.","italic":false,"final":false},{"type":"p","i":47,"text":"«Che la Sfida dei Regni abbia inizio.»","italic":false,"final":false},{"type":"art","src":"/The-Last-Chance-READER/chapters/CAP04/CAP04_ILL_01_SFIDA_DEI_REGNI_DEFINITIVA.jpeg?v=57c4bb19","alt":"La Sfida dei Regni nella corte del Regno Celeste","cls":"square"},{"type":"p","i":48,"text":"Il primo candidato è un guerriero esperto, uno di quelli che basta osservare per capire che non è stato mandato lì per caso. Ha il portamento di chi è abituato al combattimento e raggiunge il podio senza mostrare esitazione.","italic":false,"final":false},{"type":"p","i":49,"text":"Afferra l’impugnatura con entrambe le mani.","italic":false,"final":false},{"type":"p","i":50,"text":"La Spada non si muove.","italic":false,"final":false},{"type":"p","i":51,"text":"Insiste per qualche istante, poi lascia la presa e si allontana.","italic":false,"final":false},{"type":"p","i":52,"text":"È soltanto il primo.","italic":false,"final":false},{"type":"p","i":53,"text":"Tra i nomi che richiamano subito l’attenzione c’è quello di Ares, arrivato con la delegazione greca.","italic":false,"final":false},{"type":"p","i":54,"text":"L’ho già incontrato più volte in occasioni ufficiali e non mi sorprende vederlo avanzare con la stessa sicurezza di sempre. Raggiunge il podio senza rallentare, afferra l’impugnatura e tira.","italic":false,"final":false},{"type":"p","i":55,"text":"La Spada non si muove.","italic":false,"final":false},{"type":"p","i":56,"text":"Ares cambia posizione e ci riprova, questa volta mettendoci tutta la forza che può. Il risultato non cambia. Quando lascia la presa, sul suo volto è rimasto ben poco della sicurezza con cui era arrivato.","italic":false,"final":false},{"type":"p","i":57,"text":"Dopo di lui ne passano altri. Una donna tenta con entrambe le mani, poi un guerriero molto più massiccio di lei. Un altro ancora resta davanti alla custodia qualche istante prima di provarci, come se stesse cercando di capire qualcosa che agli altri è sfuggito.","italic":false,"final":false},{"type":"p","i":58,"text":"Se ne vanno tutti allo stesso modo.","italic":false,"final":false},{"type":"p","i":59,"text":"Quando viene chiamato Susanoo, della delegazione giapponese, nella corte torna a sollevarsi un brusio. Non l’ho mai incontrato, ma il suo nome basta. Lo seguo con lo sguardo mentre raggiunge il centro, apparentemente indifferente a ciò che è successo prima di lui.","italic":false,"final":false},{"type":"p","i":60,"text":"La sua sicurezza dura poco più di quella di Ares.","italic":false,"final":false},{"type":"p","i":61,"text":"Fa un solo vero tentativo. Poi resta immobile per qualche secondo, fissa la custodia e si allontana senza dire nulla.","italic":false,"final":false},{"type":"p","i":62,"text":"La sequenza continua.","italic":false,"final":false},{"type":"p","i":63,"text":"A ogni nuovo candidato c’è qualcuno tra il pubblico che sembra aspettarsi finalmente qualcosa di diverso. Dopo un po’, però, perfino quelle reazioni cominciano a spegnersi.","italic":false,"final":false},{"type":"p","i":64,"text":"Kartikeya arriva molto più tardi, insieme alla delegazione indiana. L’ho visto soltanto da lontano in passato, ma il modo in cui si muove è difficile da confondere: composto, preciso, senza alcun bisogno di attirare l’attenzione. Sistema bene la presa e applica la forza con calma, aumentando poco alla volta.","italic":false,"final":false},{"type":"p","i":65,"text":"Niente.","italic":false,"final":false},{"type":"p","i":66,"text":"Lascia l’impugnatura e si ritira senza mostrare irritazione.","italic":false,"final":false},{"type":"p","i":67,"text":"A quel punto smetto di chiedermi chi possa essere abbastanza forte.","italic":false,"final":false},{"type":"p","i":68,"text":"La domanda è un’altra.","italic":false,"final":false},{"type":"p","i":69,"text":"Che cosa manca?","italic":false,"final":false},{"type":"p","i":70,"text":"Le ore successive non portano una risposta. I nomi cambiano, così come i volti, la provenienza e il modo di affrontare la prova. Alcuni arrivano convinti, altri prudenti. Qualcuno insiste più del necessario.","italic":false,"final":false},{"type":"p","i":71,"text":"La Spada resta dov’è.","italic":false,"final":false},{"type":"p","i":72,"text":"Quando ormai ho perso il conto dei candidati, nessuno è ancora riuscito a sollevarla.","italic":false,"final":false},{"type":"p","i":73,"text":"Sono passate ore dall’inizio della Sfida.","italic":false,"final":false},{"type":"p","i":74,"text":"I candidati continuano a succedersi, ma nella corte è rimasto ben poco dell’attesa con cui tutto era cominciato. Ogni nuovo tentativo porta allo stesso risultato.","italic":false,"final":false},{"type":"p","i":75,"text":"Il Padre alza una mano.","italic":false,"final":false},{"type":"p","i":76,"text":"Il candidato davanti alla custodia lascia la presa e si fa da parte. Il brusio si abbassa lentamente.","italic":false,"final":false},{"type":"p","i":77,"text":"«La Sfida dei Regni non termina qui. Chi ritiene di poter affrontare la prova avrà ancora modo di presentarsi.»","italic":false,"final":false},{"type":"p","i":78,"text":"Fa un passo indietro, lasciando la custodia aperta davanti a sé.","italic":false,"final":false},{"type":"p","i":79,"text":"«I tentativi di oggi finiscono qui. Potete andare.»","italic":false,"final":false},{"type":"p","i":80,"text":"Il silenzio dura poco. Le delegazioni cominciano a muoversi, gli ultimi candidati lasciano la zona d’attesa e i Guardiani si dispongono lungo i percorsi d’uscita.","italic":false,"final":false},{"type":"p","i":81,"text":"Resto al mio posto finché gran parte della corte non si è svuotata.","italic":false,"final":false},{"type":"p","i":82,"text":"Poi sento la voce di Uriel.","italic":false,"final":false},{"type":"p","i":83,"text":"«Gabriel.»","italic":false,"final":false},{"type":"p","i":84,"text":"Uriel indica il podio.","italic":false,"final":false},{"type":"p","i":85,"text":"«Chiudi la custodia e portala via.»","italic":false,"final":false},{"type":"p","i":86,"text":"«Subito.»","italic":false,"final":false},{"type":"p","i":87,"text":"Attraverso la corte ormai quasi vuota. Il Padre è ancora accanto al podio.","italic":false,"final":false},{"type":"p","i":88,"text":"Solo da vicino riesco finalmente a vedere l’arma per ciò che è. È enorme, lunga più o meno quanto me. Una cicatrice nera, irregolare, attraversa la lama; poco più in là, alcune incisioni ricordano la forma di ali.","italic":false,"final":false},{"type":"p","i":89,"text":"Dovrei richiudere la custodia e basta. Eppure indugio.","italic":false,"final":false},{"type":"p","i":90,"text":"È assurdo, ma mi sembra familiare.","italic":false,"final":false},{"type":"p","i":91,"text":"Non saprei spiegare perché.","italic":false,"final":false},{"type":"p","i":92,"text":"Sto per richiudere la custodia quando un bagliore azzurro si accende nelle spaccature della cicatrice.","italic":false,"final":false},{"type":"p","i":93,"text":"La luce le percorre per un istante.","italic":false,"final":false},{"type":"p","i":94,"text":"Il Padre è ancora dall’altra parte del podio. Ora, però, la sua attenzione è su di me.","italic":false,"final":false},{"type":"p","i":95,"text":"«Aspetta. Prova a prenderla.»","italic":false,"final":false},{"type":"p","i":96,"text":"Per qualche secondo non reagisco.","italic":false,"final":false},{"type":"p","i":97,"text":"«Non ero tra i candidati.»","italic":false,"final":false},{"type":"p","i":98,"text":"«Lo so.»","italic":false,"final":false},{"type":"p","i":99,"text":"Uriel è ancora poco distante. Lo guardo, in attesa di una direttiva.","italic":false,"final":false},{"type":"p","i":100,"text":"Non fa alcun cenno.","italic":false,"final":false},{"type":"p","i":101,"text":"Per ore ho visto guerrieri e divinità fallire nello stesso punto in cui mi trovo io.","italic":false,"final":false},{"type":"p","i":102,"text":"Allungo la mano.","italic":false,"final":false},{"type":"p","i":103,"text":"Le dita si chiudono sull’impugnatura.","italic":false,"final":false},{"type":"p","i":104,"text":"Mi preparo a trovare la stessa resistenza che ha fermato tutti gli altri.","italic":false,"final":false},{"type":"p","i":105,"text":"Tiro.","italic":false,"final":false},{"type":"p","i":106,"text":"La Spada viene via subito.","italic":false,"final":false},{"type":"p","i":107,"text":"Il peso non ha niente di eccezionale.","italic":false,"final":false},{"type":"p","i":108,"text":"Ed è proprio questo a lasciarmi incredulo.","italic":false,"final":false},{"type":"p","i":109,"text":"Non so cosa dovrei fare adesso.","italic":false,"final":false},{"type":"p","i":110,"text":"Alzo gli occhi verso il Padre. Poi cerco Uriel.","italic":false,"final":false},{"type":"p","i":111,"text":"Per un attimo, il Comandante perde la sua solita compostezza. Poi si ricompone.","italic":false,"final":false},{"type":"p","i":112,"text":"«La Spada ha finalmente trovato il suo portatore. Gabriel, da questo momento la affido a te.»","italic":false,"final":false},{"type":"p","i":113,"text":"Gli applausi partono dalle logge ancora occupate e si diffondono tra chi è rimasto. Qualcuno esulta.","italic":false,"final":false},{"type":"p","i":114,"text":"Uriel inclina appena il capo.","italic":false,"final":false},{"type":"p","i":115,"text":"Io continuo a tenerla tra le mani, ancora incredulo.","italic":false,"final":false},{"type":"p","i":116,"text":"Fino a poco prima non avrei dovuto nemmeno provarci.","italic":false,"final":false},{"type":"p","i":117,"text":"Il Padre lascia che gli applausi si esauriscano e congeda i presenti.","italic":false,"final":false},{"type":"p","i":118,"text":"Prima di allontanarsi, si avvicina quanto basta perché soltanto io possa sentirlo.","italic":false,"final":false},{"type":"p","i":119,"text":"«Ti aspetto tra poco nella Sala del Concilio dei Pochi.»","italic":false,"final":false},{"type":"p","i":120,"text":"Annuisco. Uriel mi raggiunge.","italic":false,"final":false},{"type":"p","i":121,"text":"«La Spada resta con te» dice il Comandante. «Ormai è tua.»","italic":false,"final":false},{"type":"p","i":122,"text":"Sgancio la mia vecchia spada e sistemo quella nuova nelle cinghie sulla schiena. L’altra finisce nell’alloggiamento rimasto libero.","italic":false,"final":false},{"type":"p","i":123,"text":"«Riporta la custodia nella tua stanza. Poi torna al servizio.»","italic":false,"final":false},{"type":"p","i":124,"text":"«Il Padre mi ha convocato.»","italic":false,"final":false},{"type":"p","i":125,"text":"Uriel non fa domande. «Allora vai. Ci vediamo più tardi.»","italic":false,"final":false},{"type":"p","i":126,"text":"Mentre rientro, il pensiero torna sempre allo stesso punto.","italic":false,"final":false},{"type":"p","i":127,"text":"Perché proprio io?","italic":false,"final":false},{"type":"p","i":128,"text":"Poi c’è la convocazione.","italic":false,"final":false},{"type":"p","i":129,"text":"Che cosa vuole ancora da me?","italic":false,"final":false},{"type":"p","i":130,"text":"Lascio la custodia nella stanza e riparto, con entrambe le domande ancora in testa.","italic":false,"final":false},{"type":"p","i":131,"text":"«Come ti senti?» mi chiede il Padre mentre si sposta di qualche passo.","italic":false,"final":false},{"type":"p","i":132,"text":"La sala è vuota. Il grande tavolo occupa il centro, circondato da troni tutti diversi. Qui si riuniscono i sette membri quando una questione richiede un confronto più ristretto, sotto la presidenza del Padre. Stavolta siamo soltanto noi due.","italic":false,"final":false},{"type":"p","i":133,"text":"«Confuso. Avete capito perché abbia reagito proprio a me?»","italic":false,"final":false},{"type":"p","i":134,"text":"«Non con certezza» risponde.","italic":false,"final":false},{"type":"p","i":135,"text":"«Uriel ti sta preparando da tempo. Quando arriverà il momento della successione, sono convinto che la scelta ricadrà su di te.»","italic":false,"final":false},{"type":"p","i":136,"text":"«Come Comandante?»","italic":false,"final":false},{"type":"p","i":137,"text":"«Sì.»","italic":false,"final":false},{"type":"p","i":138,"text":"Non è ciò che mi aspettavo di sentire.","italic":false,"final":false},{"type":"p","i":139,"text":"«E la Spada?» dico.","italic":false,"final":false},{"type":"p","i":140,"text":"«Qualunque sia il motivo della scelta, da oggi fa parte del tuo cammino. Avrai responsabilità più grandi di quelle che hai adesso, Gabriel. Credo che ti accompagnerà.»","italic":false,"final":false},{"type":"p","i":141,"text":"Per un attimo, il pensiero di averla ormai con me assume un peso diverso.","italic":false,"final":false},{"type":"p","i":142,"text":"«Custodiscila.»","italic":false,"final":false},{"type":"p","i":143,"text":"Annuisco.","italic":false,"final":false},{"type":"p","i":144,"text":"«Lo farò.»","italic":false,"final":false},{"type":"art","src":"/The-Last-Chance-READER/chapters/CAP04/CAP04_ILL_02_CONCILIO_PADRE_GABRIEL_DEFINITIVA.jpeg?v=90a2c379","alt":"Gabriel e il Padre nella Sala del Concilio dei Pochi","cls":"square"},{"type":"sep","symbol":"*"},{"type":"p","i":145,"text":"Erano passati quasi vent'anni da quel giorno. Sistemai la Spada accanto al resto dell'equipaggiamento e rimasi a osservarla.","italic":false,"final":false},{"type":"p","i":146,"text":"«Aveva ragione. Sei ancora qui con me.»","italic":false,"final":false},{"type":"p","i":147,"text":"In tutto quel tempo era diventata una presenza abituale, quasi impossibile da separare dalla mia vita. Mi aveva seguito in servizio, in battaglia e nei periodi di quiete.","italic":false,"final":false},{"type":"p","i":148,"text":"Quel primo incontro, però, lasciava dietro di sé qualcosa di irrisolto.","italic":false,"final":false},{"type":"p","i":149,"text":"Non stupore. Più una lieve inquietudine.","italic":false,"final":false},{"type":"p","i":150,"text":"La conoscevo in ogni dettaglio, ma una cosa continuava a sfuggirmi: perché avesse scelto proprio me.","italic":false,"final":false},{"type":"p","i":151,"text":"E tra pochi giorni sarebbe scesa con me all'Inferno.","italic":false,"final":false},{"type":"p","i":152,"text":"Nei due giorni successivi non ebbi molto spazio per pensare ad altro.","italic":false,"final":false},{"type":"p","i":153,"text":"Riorganizzai turni e incarichi dei Guardiani per coprire la mia assenza, diedi disposizioni a chi avrebbe gestito i vari settori e controllai equipaggiamento e provviste.","italic":false,"final":false},{"type":"p","i":154,"text":"Tra un impegno e l’altro consultai tutto ciò che riuscii a trovare sulla discesa e sul percorso che mi attendeva. C’erano descrizioni, resoconti, avvertimenti. Nulla che chiarisse davvero cosa mi aspettasse una volta laggiù.","italic":false,"final":false},{"type":"p","i":155,"text":"Continuai ad allenarmi come sempre. Cambiare abitudini proprio allora non avrebbe avuto senso.","italic":false,"final":false},{"type":"p","i":156,"text":"Alla fine, l’essenziale era pronto.","italic":false,"final":false},{"type":"p","i":157,"text":"Alla partenza mancavano cinque giorni.","italic":false,"final":false},{"type":"sep","symbol":"⁂"},{"type":"p","i":158,"text":"L’uomo rimase a pochi passi dal limite della luce. Più avanti, qualcuno ascoltava senza mostrarsi.","italic":false,"final":false},{"type":"p","i":159,"text":"«Dimmi.»","italic":true,"final":false},{"type":"p","i":160,"text":"«La Spada ha scelto un portatore.»","italic":false,"final":false},{"type":"p","i":161,"text":"Nessuna risposta.","italic":false,"final":false},{"type":"p","i":162,"text":"«Si chiama Gabriel. È un Guardiano Celeste. L’arma è quasi della sua altezza. Sulla lama c’è una cicatrice nera, irregolare. Quando—»","italic":false,"final":false},{"type":"p","i":163,"text":"«Basta.»","italic":true,"final":false},{"type":"p","i":164,"text":"L’uomo tacque.","italic":false,"final":false},{"type":"p","i":165,"text":"Dopo qualche istante, la stessa voce parlò di nuovo.","italic":false,"final":false},{"type":"p","i":166,"text":"«Allora è così... BENE.»","italic":true,"final":true}]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
function fillText(container,item,text){
  const target=item.italic?document.createElement("em"):container;
  if(item.italic)container.appendChild(target);
  if(item.final){
    const parts=text.split(/(BENE\.)/);
    for(const part of parts){
      if(!part)continue;
      if(part==="BENE."){
        const s=document.createElement("span");s.className="final-emphasis";s.textContent=part;target.appendChild(s);
      }else target.appendChild(document.createTextNode(part));
    }
  }else target.textContent=text;
}
function nodeFor(item){
  if(item.type==="art"){
    const f=document.createElement("figure");f.className="story-art "+item.cls;
    const im=document.createElement("img");im.src=item.src;im.alt=item.alt;im.draggable=false;f.appendChild(im);return f;
  }
  if(item.type==="sep"){
    const p=document.createElement("p");p.className="separator";p.textContent=item.symbol;return p;
  }
  const p=document.createElement("p");fillText(p,item,item.text);return p;
}
function makePage(){
  const s=document.createElement("section");s.className="book-page reading-page";
  const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d};
}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
  const p=document.createElement("p");if(isContinuation)p.style.textIndent="0";fillText(p,item,text);page.d.appendChild(p);return p;
}
function paginate(){
  [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
  let page=makePage(),pendingArt=null;
  const newPage=()=>{
    page=makePage();
    if(pendingArt){
      const art=nodeFor(pendingArt);art.style.height="50dvh";page.d.appendChild(art);pendingArt=null;
    }
  };
  for(const item of DATA.items){
    if(item.type==="art"){
      const art=nodeFor(item);art.style.height="50dvh";page.d.appendChild(art);
      if(!fits(page.d)){art.remove();pendingArt=item}
      continue;
    }
    if(item.type==="sep"){
      const sep=nodeFor(item);page.d.appendChild(sep);
      if(!fits(page.d)){sep.remove();newPage();page.d.appendChild(nodeFor(item))}
      continue;
    }
    const words=item.text.split(/\s+/);let pos=0,continuation=false;
    while(pos<words.length){
      let lo=1,hi=words.length-pos,best=0,test=null;
      while(lo<=hi){
        const mid=(lo+hi)>>1;if(test)test.remove();
        test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
        if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
      }
      if(test)test.remove();
      if(best===0){newPage();continue}
      appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
      pos+=best;continuation=true;
      if(pos<words.length)newPage();
    }
  }
  if(pendingArt)newPage();
  const end=document.createElement("section");end.className="book-page end";
  end.innerHTML='<div><h2>Fine del Capitolo IV</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP03/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a><a href="../CAP05/index.html">Capitolo successivo →</a></nav></div>';
  track.appendChild(end);update();
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;
function pages(){return [...track.querySelectorAll(".book-page")]}
function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}
function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}
function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}
prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);
track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});
track.addEventListener("pointerdown",show);
bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap04-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;
addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP04 pagination error",e);paginateFallback()}show()}
function paginateFallback(){
  [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
  let page=makePage(),count=0;
  for(const item of DATA.items){
    const n=nodeFor(item);
    if(item.type==="art")n.style.height="50dvh";
    page.d.appendChild(n);count++;
    if(count>=5){page=makePage();count=0}
  }
  const end=document.createElement("section");end.className="book-page end";
  end.innerHTML='<div><h2>Fine del Capitolo IV</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP03/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a><a href="../CAP05/index.html">Capitolo successivo →</a></nav></div>';
  track.appendChild(end);update();
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
</script><script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/The-Last-Chance-READER/sw.js",{scope:"/The-Last-Chance-READER/",updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));}
</script></body></html>
