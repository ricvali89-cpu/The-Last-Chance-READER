const DATA={"paragraphs":[{"i":0,"text":"Ho sempre trovato gli esseri umani difficili da comprendere."},{"i":1,"text":"Forse era proprio per questo che continuavo a interessarmi a loro."},{"i":2,"text":"Dal Regno Celeste arrivavano rapporti sempre più frequenti sulla Terra. All'inizio non erano molto diversi da quelli che avevo letto per anni: guerre, rivolte, carestie, governi che cadevano e altri pronti a prendere il loro posto."},{"i":3,"text":"Gli uomini avevano una straordinaria capacità di sopravvivere ai propri errori."},{"i":4,"text":"E un talento ancora maggiore nel ripeterli."},{"i":5,"text":"Poi qualcosa cambiò."},{"i":6,"text":"Non ci fu un giorno preciso. Nessuna esplosione abbastanza grande da poter dire: ecco, è cominciata la fine."},{"i":7,"text":"Fu molto più lento."},{"i":8,"text":"Prima aumentarono le guerre."},{"i":9,"text":"Le risorse diminuivano, le popolazioni crescevano e ogni nazione trovava una ragione diversa per convincersi che ciò che restava spettasse a lei. Acqua. Cibo. Energia. Territorio."},{"i":10,"text":"Cambiano i secoli. Cambiano le armi."},{"i":11,"text":"Le ragioni, molto meno."},{"i":12,"text":"Poi arrivarono la fame e la sete."},{"i":13,"text":"Intere città smisero di essere città. I confini persero significato. Alcuni governi continuarono a esistere soltanto sulle mappe, finché anche quelle smisero di avere importanza."},{"i":14,"text":"E quando caddero le nazioni, la legge le seguì."},{"i":15,"text":"Eppure una cosa continuava a incuriosirmi."},{"i":16,"text":"Nemmeno la fine del mondo era riuscita a metterli sullo stesso piano."},{"i":17,"text":"Alcuni non avevano più nulla. Altri avevano conservato quasi tutto."},{"i":18,"text":"Nei rapporti leggevo di persone che passavano intere giornate alla ricerca di acqua e di città dove procurarsi del cibo era diventato più difficile che procurarsi un'arma."},{"i":19,"text":"Poi leggevo di altri luoghi."},{"i":20,"text":"Città protette da mura, illuminate anche di notte. Cibo, musica, feste. Persone che continuavano a vivere quasi come se ciò che accadeva dall'altra parte delle mura appartenesse a un altro mondo."},{"i":21,"text":"Non capivo perché funzionasse così."},{"i":22,"text":"Nel Regno Celeste esistevano ranghi. Io stesso comandavo i Guardiani. Ma un grado più alto non significava mangiare mentre qualcun altro moriva di fame."},{"i":23,"text":"Gli uomini, invece, erano riusciti a dare un valore perfino alla possibilità di sopravvivere."},{"i":24,"text":"Non provavo pena per loro."},{"i":25,"text":"Ero curioso."},{"i":26,"text":"Continuavo a leggere quei rapporti."},{"i":27,"text":"Perché, nonostante tutto, continuavano a esserci."},{"i":28,"text":"Una madre stringeva suo figlio tra le macerie."},{"i":29,"text":"Degli sconosciuti dividevano il poco cibo rimasto attorno a un fuoco."},{"i":30,"text":"Due uomini attraversavano chilometri di rovine senza sapere cosa avrebbero trovato dall'altra parte."},{"i":31,"text":"Il loro mondo stava morendo."},{"i":32,"text":"Loro no."},{"i":33,"text":"Ed era proprio questo il problema."},{"i":34,"text":"Perché mentre sulla Terra gli uomini continuavano ostinatamente a sopravvivere, nel Regno Celeste qualcuno aveva cominciato a porsi una domanda molto diversa."},{"i":35,"text":"Non come salvarli."},{"i":36,"text":"Ma se fosse ancora giusto farlo."},{"i":37,"text":"Quella risposta non spettava a me."},{"i":38,"text":"Molto al di sopra della Terra, oltre ciò che gli uomini potevano vedere, esisteva il luogo che avevo sempre chiamato casa."},{"i":39,"text":"Il Regno Celeste."},{"i":40,"text":"Non conoscevamo la fame che descrivevano quei rapporti. Non avevamo città divise tra chi possedeva tutto e chi non aveva più niente. Avevamo ranghi, compiti, responsabilità. Io stesso comandavo i Guardiani Celesti."},{"i":41,"text":"Ma nessuno doveva guadagnarsi il diritto di mangiare."},{"i":42,"text":"Forse era anche per questo che trovavo gli uomini così difficili da comprendere."},{"i":43,"text":"Quel giorno, però, comprenderli non era più sufficiente."},{"i":44,"text":"Il Grande Concilio stava per riunirsi."},{"i":45,"text":"E questa volta non avrebbe discusso di come aiutare l'umanità."},{"i":46,"text":"Avrebbe deciso se concederle ancora il diritto di esistere."}]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([0,2,5,7,9,11,14,16,18,20,23,25,28,30,32,34,36,38,40,42,44]);

for(const item of DATA.paragraphs){const words=item.text.split(/\s+/);let pos=0,continuation=false;while(pos<words.length){let lo=1,hi=words.length-pos,best=0,test=null;while(lo<=hi){const mid=(lo+hi)>>1;if(test)test.remove();test=appendPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1}if(test)test.remove();if(best===0){page=makePage();continue}appendPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);pos+=best;continuation=true;if(pos<words.length)page=makePage()}}
addClosingArt();const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo I</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../../index.html">Indice</a><a href="../CAP02/index.html">Capitolo successivo →</a></nav></div>';track.appendChild(end);update()}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap01-page",String(current));bookmarkBtn.textContent="✓"};let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});function boot(){paginate();show()}if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot).catch(boot);else boot();
</script></body></html>
