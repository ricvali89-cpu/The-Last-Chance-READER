t-fit:contain;box-shadow:0 6px 18px #0002}.section-break{display:flex;align-items:center;justify-content:center;gap:.55em;width:min(150px,45%);margin:.78em auto;color:#756b5d;opacity:.72}.section-break::before,.section-break::after{content:"";height:1px;flex:1;background:#9b8d78}.section-break span{font-size:.72em;line-height:1}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP06/CAP06_SOTTO_LA_PELLE_DEL_DIO_OPENING_DEFINITIVA.jpeg?v=f4c08eec" alt="Capitolo VI — Sotto la Pelle del Dio" draggable="false"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"paragraphs":[{"i":0,"text":"Quella pioggia non cadeva davvero: si appiccicava. Una pellicola fredda, quasi oleosa, gli scivolava sul cappuccio e lungo le spalle mentre Loki costeggiava i muri di pietra nera, scegliendo i tratti coperti ed evitando quelli più esposti. Dalle aperture laterali filtravano bagliori caldi e sagome in movimento; bastava a capire che il luogo era abitato, non abbastanza a offrirgli una via sicura.","italic":false},{"i":1,"text":"All’inizio aveva provato a muoversi senza nascondersi, presentandosi come inviato del Padre e citando l’ordine trasmesso attraverso Odino. Pensava che almeno chi controllava la discesa fosse stato informato della missione. Si sbagliava. Le guardie gli avevano intimato di fermarsi; al suo rifiuto, il confronto era degenerato fino a costringerlo alla fuga. Da allora si esponeva il meno possibile. Con il bracciale al polso, niente trasformazioni, niente illusioni, niente magia su cui contare. Una lama avrebbe fatto il suo lavoro.","italic":false},{"i":2,"text":"Voci basse e un rumore cadenzato si avvicinarono dal vicolo. Si infilò nella rientranza fra due pilastri e si appiattì contro la parete umida mentre la pattuglia attraversava la strada. Uno di loro arrivò così vicino da sfiorare con la spalla il bordo del riparo. Nessuno si fermò.","italic":false},{"i":3,"text":"Di fronte a lui, una figura si gettò a terra e serrò fra le mani qualcosa che non riuscì a distinguere. Per un istante si quietò. Poi ciò che teneva si sbriciolò fra le dita. Ricominciò a cercare prima ancora che gli ultimi frammenti toccassero il suolo. Attese finché il gruppo non sparì oltre la curva, poi uscì. Poco più avanti, un canale trascinava acqua scura, cenere e residui verso il basso. Seguì quella direzione.","italic":false},{"i":4,"text":"Il percorso si restrinse sotto una sequenza di archi. A tratti il pavimento terminava senza preavviso, sostituito da passerelle sospese sul vuoto. Da una di esse, al di là di un parapetto spezzato, tetti, ponti e punti di fuoco punteggiavano la profondità. Era solo un frammento, ma gli confermò di essere ancora sulla via giusta.","italic":false},{"i":5,"text":"Un richiamo secco risuonò dall’alto. Non attese di capire a chi fosse rivolto. Una deviazione stretta si apriva tra due muri inclinati; la imboccò. Le luci degli edifici scomparvero dietro di lui. Dopo pochi metri la pioggia cessò di raggiungerlo. L’umidità rimase sulle pietre, mentre il cunicolo perdeva quota e si chiudeva nel buio.","italic":false},{"i":6,"text":"Non tornò indietro.","italic":false},{"i":7,"text":"Il rumore del metallo arrivava da ogni direzione. Catene tese correvano sopra carrucole incassate nella roccia scura e sparivano dentro strutture massicce, mentre file di figure trascinavano carichi enormi lungo corsie obbligate. La polvere velava ogni cosa. Il disordine che aveva incontrato più in alto aveva lasciato posto a qualcosa di più difficile da aggirare: un sistema.","italic":false},{"i":8,"text":"Due guardie presidiavano un punto in cui le corsie convergevano. Loki rimase fuori dalla loro visuale e studiò il ritmo con cui lasciavano transitare le file. Ognuna rallentava davanti al controllo e ripartiva soltanto quando il tratto successivo si liberava.","italic":false},{"i":9,"text":"Un dannato inciampò e il carico gli sfuggì, rotolando fuori dalla corsia. Per qualche secondo nessuno lo trattenne; davanti a lui c’era spazio libero. Fece due passi. Poi si voltò di colpo e si gettò sul peso, stringendolo con entrambe le braccia prima di ricominciare a trascinarlo.","italic":false},{"i":10,"text":"Loki aspettò che un’altra fila impegnasse le guardie, poi si accodò al margine esterno. I carichi tra lui e il presidio bastarono a spezzare la visuale. Superato il punto sorvegliato, si staccò dal flusso e imboccò una deviazione fra due masse di roccia. Il clangore continuò a seguirlo ancora per un tratto, finché anche quello si perse nell’oscurità.","italic":false},{"i":11,"text":"Le acque basse e nere si estendevano ai lati di lingue irregolari di terreno, interrotte da argini di pietra e tratti appena abbastanza larghi da passarci sopra. Vapori rossastri galleggiavano poco sopra la superficie e cancellavano tutto ciò che si trovava oltre una certa distanza. Da qualche parte, dentro quella foschia, arrivavano urla, colpi sordi e improvvisi spruzzi d’acqua. Loki proseguì lungo uno degli argini, scegliendo il tratto che scendeva più in profondità.","italic":false},{"i":12,"text":"Due sagome emersero dal vapore alla sua sinistra, già avvinghiate l’una all’altra. Caddero nell’acqua continuando a colpirsi, si separarono per qualche metro e, appena riuscirono a rimettersi in piedi, tornarono a cercarsi con la stessa furia. Loki le lasciò alle proprie spalle. In quel luogo non aveva alcun interesse a capire ogni cosa che vedeva.","italic":false},{"i":13,"text":"Fu poco dopo che qualcosa cambiò. Una presenza familiare affiorò sotto la pelle, tenue ma impossibile da confondere: la propria natura divina. Loki guardò il bracciale. Era ancora al suo posto, integro. La sensazione svanì quasi subito, senza dolore.","italic":false},{"i":14,"text":"La avvertì di nuovo quando il terreno cominciò ad abbassarsi, questa volta più netta. Loki proseguì per verificare che non fosse un’impressione; al tratto successivo si intensificò. Solo allora richiamò una quantità infinitesimale del proprio potere, troppo poca per produrre qualsiasi effetto visibile. Qualcosa rispose.","italic":false},{"i":15,"text":"Il bracciale non aveva ceduto. Continuava a trattenere quella parte di lui, soltanto con meno efficacia. E l’unica cosa che cambiava era la profondità. Vaelkar era più in basso.","italic":false},{"i":16,"text":"La fitta arrivò poco dopo, nella mano destra: una bruciatura senza fiamma, improvvisa e profonda. Durò pochi istanti, ma più avanti tornò con maggiore intensità. Questa volta rimase. Sul dorso comparvero arrossamenti irregolari, attraversati da sottili venature scure, mentre muovere le dita diventava progressivamente più difficile.","italic":false},{"i":17,"text":"Quando fu costretto a fermarsi, arretrò di alcuni metri. Il bruciore diminuì quasi subito; le dita ripresero a rispondere e anche quella parte di sé che stava riaffiorando si attenuò. Non era un caso.","italic":false},{"i":18,"text":"Avrebbe potuto fermarsi lì. Aveva già una risposta, ma non sapeva ancora quanto lontano potesse spingersi prima che diventasse impossibile proseguire. Tornare indietro senza scoprirlo avrebbe significato lasciare irrisolta la parte più importante.","italic":false},{"i":19,"text":"Riprese la stessa direzione. Nel punto in cui poco prima il dolore aveva cominciato ad attenuarsi non accadde nulla; qualche metro più avanti, invece, la pressione riaffiorò. Ancora oltre, le dita della destra si irrigidirono e le tracce scure si fecero più marcate.","italic":false},{"i":20,"text":"Non c’era una linea da oltrepassare. Nessun segno sul terreno, nessun varco, niente che dividesse una zona sicura da una pericolosa. Più scendeva, più il bracciale perdeva presa sulla sua natura divina. E più quella riemergeva, più il suo corpo ne pagava il prezzo.","italic":false},{"i":21,"text":"La pelle attorno alle venature già comparse iniziò a scurirsi. Il bruciore penetrò più a fondo, risalendo verso il polso, e chiudere completamente la mano divenne difficile. Continuò per pochi metri.","italic":false},{"i":22,"text":"Il dolore esplose nella destra senza preavviso. Le dita si contrassero e la pelle già scurita virò quasi al nero, aprendosi in più punti sul dorso e lungo il palmo. Le lesioni risalirono verso il polso e raggiunsero l’inizio dell’avambraccio. Non c’era calore intorno a lui, nessuna fiamma da cui difendersi: quella bruciatura sembrava nascere dentro la carne.","italic":false},{"i":23,"text":"Anche il resto cambiò. La presenza divina che il bracciale avrebbe dovuto soffocare tornò con una forza che non aveva più sentito dal momento in cui lo aveva indossato. Per un istante gli parve quasi naturale. Subito dopo l’Inferno reagì.","italic":false},{"i":24,"text":"Il fiato gli si spezzò. Le gambe cedettero e dovette appoggiarsi con la sinistra alla pietra per non finire nell’acqua. La destra ormai rispondeva appena. Aveva trovato il limite.","italic":false},{"i":25,"text":"Si voltò per tornare indietro. Il primo passo riuscì. Il secondo quasi. Al terzo, una nuova ondata gli attraversò il corpo e la vista si riempì di macchie scure. Provò comunque a risalire, ma la distanza che poco prima aveva percorso senza difficoltà sembrava essersi allungata. Ogni movimento arrivava troppo tardi rispetto al dolore. Cadde su un ginocchio.","italic":false},{"i":26,"text":"Qualcuno lo afferrò da dietro.","italic":false},{"i":27,"text":"Per un istante reagì d’istinto, ma non aveva abbastanza forza neppure per liberarsi. Un braccio gli passò sotto il petto e lo trascinò nella direzione da cui era venuto. La pietra gli scorse sotto gli stivali, poi sotto le gambe. Non riuscì a capire quanto terreno avessero percorso; si accorse soltanto che, poco alla volta, la pressione dentro di lui diminuiva.","italic":false},{"i":28,"text":"Il bracciale tornò a soffocare quasi del tutto la sua natura divina.","italic":false},{"i":29,"text":"Quando la vista tornò nitida, era disteso su un tratto più alto dell’argine. Una donna era china su di lui, abbastanza vicina da permettergli di distinguere il volto nonostante la foschia. Lunghi capelli scuri le ricadevano ai lati. Sul mento portava una piccola cicatrice. Ma furono gli occhi a restargli impressi: uno azzurro, l’altro marrone ambrato.","italic":false},{"i":30,"text":"Lei lo osservò ancora per qualche secondo, come per assicurarsi che respirasse. «Se continuerai a scendere, morirai.»","italic":false},{"i":31,"text":"Loki riuscì appena a piegare un angolo della bocca. «Cominciavo a sospettarlo.»","italic":false}],"arts":[{"after":29,"src":"/The-Last-Chance-READER/chapters/CAP06/CAP06_ILL_01_DEFINITIVA.jpeg?v=a752063a","alt":"Una donna soccorre Loki dopo il limite della discesa infernale","cls":"wide"}],"breaks":[6,10]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([]);
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;f.appendChild(im);return f}if(item.type==="break"){const d=document.createElement("div");d.className="section-break";d.setAttribute("aria-hidden","true");d.innerHTML="<span>✦</span>";return d}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});DATA.arts.filter(x=>x.after===p.i).forEach(a=>out.push({type:"art",...a}));if(DATA.breaks.includes(p.i))out.push({type:"break"})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   if(item.type==="break"){
     const br=nodeFor(item);
     page.d.appendChild(br);
     if(!fits(page.d)){br.remove();newPage();page.d.appendChild(nodeFor(item))}
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VI</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP05/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap06-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP05 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VI</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP05/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
</script><script>
