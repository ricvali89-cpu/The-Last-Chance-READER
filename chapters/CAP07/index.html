t-fit:contain;box-shadow:0 6px 18px #0002}.section-break{display:flex;align-items:center;justify-content:center;gap:.55em;width:min(150px,45%);margin:.78em auto;color:#756b5d;opacity:.72}.section-break::before,.section-break::after{content:"";height:1px;flex:1;background:#9b8d78}.section-break span{font-size:.72em;line-height:1}.story-art.portrait img{width:min(92vw,580px);max-width:100%;height:100%;object-fit:contain}.story-art.wide img{max-width:100%;max-height:100%}.final-name{text-align:center;text-indent:0!important;font-size:clamp(30px,9vw,58px);font-weight:700;letter-spacing:.1em;margin-top:1em!important}.end{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,"Times New Roman",serif}.chapter-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.chapter-nav a{display:inline-block;padding:12px 18px;border:1px solid #9b8d78;color:#191816;text-decoration:none;font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase}.controls{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:999px;background:#111d;color:#fff;transition:.25s}.controls.hidden{opacity:0;pointer-events:none;transform:translate(-50%,10px)}.controls button{border:0;background:none;color:#fff;font-size:25px;padding:2px 9px}.controls .bookmark-control{font-size:18px;padding:3px 8px;border-left:1px solid #ffffff33;margin-left:2px}.controls span{font:12px system-ui;min-width:50px;text-align:center}

</style></head><body><main id="track" class="book-track"><section class="book-page opening"><img src="/The-Last-Chance-READER/chapters/CAP07/CAP07_IL_CONFINE_OPENING_DEFINITIVA.jpeg?v=2d877e01" alt="Capitolo VII — Il Confine" draggable="false"></section></main><div class="controls" id="controls"><button id="prev">‹</button><span id="counter">1 / 1</span><button id="next">›</button><button id="bookmark" class="bookmark-control" aria-label="Segnalibro">🔖</button></div><script>
const DATA={"paragraphs":[{"i":0,"text":"Mi svegliai di colpo. Il respiro era accelerato, ma intorno a me la stanza era immobile. Dell’incubo non conservavo quasi nulla: nessun volto, nessun luogo, nessuna scena che riuscissi a trattenere. Solo una sensazione sgradevole che continuava a restarmi addosso anche da sveglio.","italic":false},{"i":1,"text":"Mi passai una mano sul viso e lasciai che il battito tornasse regolare. L’inquietudine, invece, non se ne andò. Non era paura, almeno non la riconoscevo come tale. Era qualcosa di più vago, senza un motivo preciso a cui poterlo attribuire.","italic":false},{"i":2,"text":"La luce del mattino filtrava già nella stanza. Era l’ultimo giorno prima della partenza. Per la prima volta da quando il Padre mi aveva affidato la missione, non avevo nulla di immediato da preparare, controllare o decidere. Fino alla sera precedente ogni ora aveva avuto uno scopo; adesso, tra me e l’Inferno, restava soltanto quel giorno.","italic":false},{"i":3,"text":"Mi alzai senza indugiare. Presi la Spada e lasciai la stanza. Appena oltre la porta, un Araldo avanzava nella mia direzione.","italic":false},{"i":4,"text":"Quando mi vide, rallentò e chinò il capo. «Comandante. Il Padre vi attende nell’Atrio Principale.»","italic":false},{"i":5,"text":"«Ha specificato il motivo?»","italic":false},{"i":6,"text":"«No, Comandante.»","italic":false},{"i":7,"text":"Non aggiunse altro. Gli feci cenno di andare e mi incamminai verso l’Atrio. Immaginai volesse darmi le ultime disposizioni prima della discesa.","italic":false},{"i":8,"text":"Quando arrivai, però, capii subito che non sarebbe stato l’incontro che mi aspettavo. Il Padre era solo. Nessun consigliere al suo fianco, nessun documento, niente che facesse pensare a una riunione ufficiale.","italic":false},{"i":9,"text":"Mi avvicinai. «Padre.»","italic":false},{"i":10,"text":"«Gabriel.» Mi accolse con la consueta calma, poi si mosse verso l’uscita. «Vieni. Cammina un po’ con me.»","italic":false},{"i":11,"text":"Raggiungemmo uno dei giardini del Regno Celeste. Il sentiero attraversava la vegetazione e costeggiava un lago dalle acque ferme. Più avanti, alcuni archi di pietra chiara si aprivano sul verde.","italic":false},{"i":12,"text":"Procedemmo in silenzio fino al bordo del lago. Poi mi chiese: «Sei pronto per partire? Hai avuto il tempo necessario?»","italic":false},{"i":13,"text":"«Sì. Ho concluso gli incarichi che restavano, continuato ad allenarmi e rivisto le informazioni che avevamo sull’Inferno. Ho parlato con Uriel.»","italic":false},{"i":14,"text":"Proseguimmo. A un certo punto il suo sguardo scese sul mio petto e si fermò proprio dove, sotto gli abiti, portavo la collana. Capii subito cosa stava cercando. «A proposito. Volevo ringraziarvi. Brok e Sindri mi hanno consegnato la collana.»","italic":false},{"i":15,"text":"«Ce l’hai addosso?»","italic":false},{"i":16,"text":"«Sì.»","italic":false},{"i":17,"text":"«Ti hanno spiegato tutto?»","italic":false},{"i":18,"text":"«Mi hanno spiegato quello che potevano.»","italic":false},{"i":19,"text":"«Bene.» Mi osservò ancora per un istante. «Per ora ti basta sapere che quella collana non serve soltanto ad aiutarti laggiù. Deve anche aumentare le possibilità che tu torni.»","italic":false},{"i":20,"text":"Restammo in silenzio per qualche passo. Poi il Padre disse: «Sono passati quasi vent’anni da quando la Spada ha scelto te.»","italic":false},{"i":21,"text":"«E ancora non so perché.»","italic":false},{"i":22,"text":"«Non hai avuto bisogno di saperlo per fare ciò che dovevi.»","italic":false},{"i":23,"text":"Vent’anni prima avevo preso la Spada senza sapere cosa avrebbe cambiato nella mia vita. Ora sapevo che qualcosa sarebbe cambiato di nuovo. Non sapevo ancora cosa.","italic":false},{"i":24,"text":"«Tornerò con ciò che mi avete mandato a cercare.»","italic":false},{"i":25,"text":"Il Padre lasciò passare qualche secondo.","italic":false},{"i":26,"text":"«Qualunque cosa accada laggiù, devi tornare da me.»","italic":false},{"i":27,"text":"La frase arrivò subito dopo la mia promessa. Non la presi come un ordine, ma come una forma di fiducia.","italic":false},{"i":28,"text":"Annuii.","italic":false},{"i":29,"text":"Prima di separarci, mi disse che entro sera qualcuno sarebbe venuto nelle mie stanze per accompagnarmi fino all’accesso all’Inferno.","italic":false},{"i":30,"text":"Rientrai da solo e aspettai. Il resto del giorno trascorse senza interruzioni. Quando la luce cominciò a calare, bussarono alla porta.","italic":false},{"i":31,"text":"Aprii. Tre Guardiani Celesti mi aspettavano nel corridoio. Alla mia comparsa si misero sull’attenti; quello più vicino parlò per gli altri. «Comandante. Siamo qui per guidarvi.»","italic":false},{"i":32,"text":"«Andiamo.»","italic":false},{"i":33,"text":"Mi unii a loro e attraversammo i livelli ordinari del Regno Celeste. Il Guardiano che aveva parlato camminava al mio fianco e prendeva la testa del gruppo soltanto quando doveva indicarci una deviazione. Gli altri due ci seguivano a breve distanza.","italic":false},{"i":34,"text":"Ai primi presidi bastava che mi riconoscessero. I Guardiani di servizio salutavano e aprivano il passaggio: le disposizioni per la missione erano già arrivate.","italic":false},{"i":35,"text":"Poi il percorso cominciò a scendere. I corridoi si fecero meno frequentati e, poco alla volta, le superfici chiare e lavorate cedettero a una pietra più spoglia e grezza. Era ancora il Regno Celeste, ma non aveva più l’aspetto di un luogo costruito per essere attraversato ogni giorno.","italic":false},{"i":36,"text":"Più in basso, tra un posto di guardia e l’altro c’erano tratti sempre più lunghi. L’impressione era di attraversare una parte più antica del Regno, rimasta ai margini dei percorsi ordinari.","italic":false},{"i":37,"text":"Mi rivolsi al Guardiano al mio fianco. «Avete mai accompagnato qualcuno fin quaggiù?»","italic":false},{"i":38,"text":"Scosse il capo. «No, Comandante. Mai così in profondità.»","italic":false},{"i":39,"text":"Poco dopo, il passaggio si allargò. Davanti a noi comparve un presidio isolato, oltre il quale non vedevo altre guardie.","italic":false},{"i":40,"text":"I tre si fermarono. Il Guardiano che ci aveva guidati prese la parola. «Da qui non possiamo proseguire con voi, Comandante.»","italic":false},{"i":41,"text":"«Va bene. Rientrate.»","italic":false},{"i":42,"text":"Rimasi solo e percorsi l’ultimo tratto del corridoio, che poco dopo si aprì su una cavità enorme.","italic":false},{"i":43,"text":"Un arco di pietra nera si innalzava davanti a me. Era antico, monumentale, privo di porta, battenti o serrature. Oltre non riuscivo a distinguere nulla: soltanto un’oscurità compatta che riempiva l’intero varco.","italic":false},{"i":44,"text":"Quando mi avvicinai alla soglia, i rumori del presidio si spensero alle mie spalle. L’aria sembrava più pesante. Rimase soltanto il silenzio.","italic":false},{"i":45,"text":"Lasciai scivolare via ogni pensiero. Chiusi gli occhi e avanzai.","italic":false}],"arts":[{"after":11,"src":"/The-Last-Chance-READER/chapters/CAP07/CAP07_ILL_01_DEFINITIVA.jpeg?v=acabeae5","alt":"Gabriel e il Padre camminano nel giardino del Regno Celeste","cls":"wide"}],"breaks":[]},track=document.getElementById("track"),controls=document.getElementById("controls"),counter=document.getElementById("counter");
const EDITORIAL_BREAKS=new Set([]);
function nodeFor(item){if(item.type==="art"){const f=document.createElement("figure");f.className="story-art "+item.cls;const im=document.createElement("img");im.src=item.src;im.alt=item.alt;im.draggable=false;f.appendChild(im);return f}if(item.type==="break"){const d=document.createElement("div");d.className="section-break";d.setAttribute("aria-hidden","true");d.innerHTML="<span>✦</span>";return d}const p=document.createElement("p");if(item.italic){const e=document.createElement("em");e.textContent=item.text;p.appendChild(e)}else p.textContent=item.text;if(EDITORIAL_BREAKS.has(item.i))p.classList.add("editorial-break");return p}
function buildItems(){const out=[];DATA.paragraphs.forEach(p=>{out.push({type:"p",...p});DATA.arts.filter(x=>x.after===p.i).forEach(a=>out.push({type:"art",...a}));if(DATA.breaks.includes(p.i))out.push({type:"break"})});return out}
function makePage(){const s=document.createElement("section");s.className="book-page reading-page";const d=document.createElement("div");d.className="page-inner";s.appendChild(d);track.appendChild(s);return {s,d}}
function fits(d){return d.scrollHeight<=d.clientHeight+1}
function appendParagraphPiece(page,item,text,isContinuation=false){
 const p=document.createElement("p"); if(isContinuation)p.style.textIndent="0";
 if(item.italic){const e=document.createElement("em");e.textContent=text;p.appendChild(e)}else p.textContent=text;
 if(EDITORIAL_BREAKS.has(item.i)&&!isContinuation)p.classList.add("editorial-break"); page.d.appendChild(p); return p;
}
function paginate(){
 [...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());
 let page=makePage(),pendingArt=null;
 const newPage=()=>{
   page=makePage();
   if(pendingArt){
     const art=nodeFor(pendingArt);
     art.style.height="50dvh";
     page.d.appendChild(art);
     pendingArt=null;
   }
 };
 for(const item of buildItems()){
   if(item.type==="art"){
     const art=nodeFor(item);
     art.style.height="50dvh";
     page.d.appendChild(art);
     if(!fits(page.d)){
       art.remove();
       pendingArt=item;
       // Do NOT open a new page here: keep filling this page with prose.
       // The deferred art is inserted only when the prose naturally fills it.
     }
     continue;
   }
   if(item.type==="break"){
     const br=nodeFor(item);
     page.d.appendChild(br);
     if(!fits(page.d)){br.remove();newPage();page.d.appendChild(nodeFor(item))}
     continue;
   }
   const words=item.text.split(/\s+/);let pos=0,continuation=false;
   while(pos<words.length){
     let lo=1,hi=words.length-pos,best=0,test=null;
     while(lo<=hi){
       const mid=(lo+hi)>>1;if(test)test.remove();
       test=appendParagraphPiece(page,item,words.slice(pos,pos+mid).join(" "),continuation);
       if(fits(page.d)){best=mid;lo=mid+1}else hi=mid-1;
     }
     if(test)test.remove();
     if(best===0){newPage();continue}
     appendParagraphPiece(page,item,words.slice(pos,pos+best).join(" "),continuation);
     pos+=best;continuation=true;
     if(pos<words.length)newPage();
   }
 }
 if(pendingArt)newPage();
 const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VII</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP06/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()
}
const prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),bookmarkBtn=document.getElementById("bookmark");
let current=0,hideTimer,scrollTimer;function pages(){return [...track.querySelectorAll(".book-page")]}function show(){controls.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.add("hidden"),1600)}function update(){const p=pages();current=Math.max(0,Math.min(current,p.length-1));counter.textContent=(current+1)+" / "+p.length}function go(n){const p=pages();current=Math.max(0,Math.min(n,p.length-1));track.scrollTo({left:current*innerWidth,behavior:"smooth"});update();show()}prevBtn.onclick=()=>go(current-1);nextBtn.onclick=()=>go(current+1);track.addEventListener("scroll",()=>{show();clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{current=Math.round(track.scrollLeft/innerWidth);update()},80)});track.addEventListener("pointerdown",show);bookmarkBtn.onclick=()=>{localStorage.setItem("tlc-cap07-page",String(current));bookmarkBtn.textContent="✓"};
let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ratio=current/Math.max(1,pages().length-1);paginate();current=Math.round(ratio*Math.max(0,pages().length-1));track.scrollLeft=current*innerWidth;update()},180)});
function boot(){try{paginate()}catch(e){console.error("CAP07 pagination error",e);paginateFallback()}show()}
function paginateFallback(){[...track.querySelectorAll(".reading-page,.end")].forEach(x=>x.remove());let page=makePage(),count=0;for(const item of buildItems()){const n=nodeFor(item);page.d.appendChild(n);count++;if(count>=5){page=makePage();count=0}}const end=document.createElement("section");end.className="book-page end";end.innerHTML='<div><h2>Fine del Capitolo VII</h2><nav class="chapter-nav" aria-label="Navigazione capitoli"><a href="../CAP06/index.html">← Capitolo precedente</a><a href="../../index.html">Indice</a></nav></div>';track.appendChild(end);update()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(boot).catch(boot);setTimeout(()=>{if(pages().length===1)boot()},500)}else boot();
</script><script>
